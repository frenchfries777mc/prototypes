<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b1417">
<title>로드스타</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!--APP-->
<div id="app">
  <canvas id="cv" aria-label="전장"></canvas>

  <div id="hud" hidden>
    <div id="top">
      <div class="chg ally"><i id="chA"></i><b><span id="ka">0</span><small id="kda"></small></b></div>
      <div id="midtop"><span id="clock">00:00</span><span id="pips" aria-label="점령 지점"></span></div>
      <div class="chg enemy"><i id="chB"></i><b><span id="kb">0</span><small id="kdb"></small></b></div>
    </div>
    <div id="tools">
      <button type="button" id="scoreBtn" title="전적 (Tab)">전적</button>
      <button type="button" id="muteBtn" title="소리 (M)">소리</button>
      <button type="button" id="helpBtn" title="조작법">?</button>
    </div>
    <div id="feed" aria-live="polite"></div>
    <div id="announce"></div>
    <div id="miniWrap"><canvas id="mini" aria-label="미니맵"></canvas></div>

    <div id="bar">
      <div id="me">
        <div id="portrait"><canvas id="pcv" width="124" height="124"></canvas><b id="plevel">1</b></div>
        <div id="stats"></div>
      </div>
      <div id="core">
        <div id="skills"></div>
        <div class="vbar hp"><i id="hpf"></i><span id="hpt"></span></div>
        <div class="vbar mp"><i id="mpf"></i><span id="mpt"></span></div>
        <div class="vbar xp"><i id="xpf"></i></div>
      </div>
      <div id="inv">
        <div id="items"></div>
      </div>
    </div>

    <div id="relic" hidden><b>유물을 고르세요</b><div id="relicOpts"></div></div>
    <div id="stick" hidden><i></i></div>
    <button type="button" id="atkBtn" aria-label="공격">공격</button>
    <div id="tip" hidden></div>
    <div id="dead" hidden><strong>쓰러졌습니다</strong><span id="deadT"></span><small>곧 우물에서 다시 일어납니다. 아군이 점령한 지점은 계속 충전됩니다.</small></div>

    <section id="score" class="sheet" hidden>
      <header><h2>전적</h2><button type="button" class="x" id="scoreX">닫기</button></header>
      <div class="scroll"><table id="scoreT"></table></div>
    </section>

    <section id="help" class="sheet" hidden>
      <header><h2>조작법</h2><button type="button" class="x" id="helpX">닫기</button></header>
      <dl class="keys"></dl>
    </section>
  </div>

  <div id="menu">
    <div class="panel">
      <p class="eyebrow">5 대 5 점령전 · 봇 9명과 함께</p>
      <h1>로드스타</h1>
      <p class="lede">지도 곳곳의 <b>점령 지점 7곳</b>을 차지하면 팀 충전량이 차오릅니다. 적보다 먼저 <b>1000</b>을 채우면 이깁니다.</p>
      <div id="heroGrid" role="listbox" aria-label="영웅 선택"></div>
      <div id="heroInfo"></div>
      <div class="row">
        <div id="diff" role="radiogroup" aria-label="난이도"></div>
        <button type="button" id="startBtn">전투 시작</button>
      </div>
      <dl class="keys" id="menuKeys"></dl>
    </div>
  </div>

  <div id="end" hidden>
    <div class="panel">
      <h1 id="endTitle"></h1>
      <p id="endSub"></p>
      <div class="scroll"><table id="endT"></table></div>
      <button type="button" id="againBtn">다시 하기</button>
    </div>
  </div>
</div>
<!--/APP-->
<script src="js/data.js"></script>
<script src="js/map.js"></script>
<script src="js/sim.js"></script>
<script src="js/ai.js"></script>
<script src="js/sprites.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
