<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b1417">
<title>로드스타</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!--APP-->
<div id="app">
  <canvas id="cv" aria-label="전장"></canvas>

  <div id="hud" hidden>
    <div id="top">
      <span class="side ally"><b id="ka">0</b><small id="towA">포탑 9</small></span>
      <span id="clock">00:00</span>
      <span class="side enemy"><small id="towB">포탑 9</small><b id="kb">0</b></span>
    </div>
    <div id="tools">
      <button type="button" id="scoreBtn" title="전적 (Tab)">전적</button>
      <button type="button" id="muteBtn" title="소리 (M)">소리</button>
      <button type="button" id="helpBtn" title="조작법">?</button>
    </div>
    <div id="feed" aria-live="polite"></div>
    <div id="announce"></div>
    <div id="miniWrap"><canvas id="mini" aria-label="미니맵"></canvas></div>

    <div id="bar">
      <div id="me">
        <div id="portrait"><canvas id="pcv" width="124" height="124"></canvas><b id="plevel">1</b></div>
        <div id="stats"></div>
      </div>
      <div id="core">
        <div id="skills"></div>
        <div class="vbar hp"><i id="hpf"></i><span id="hpt"></span></div>
        <div class="vbar mp"><i id="mpf"></i><span id="mpt"></span></div>
        <div class="vbar xp"><i id="xpf"></i></div>
      </div>
      <div id="inv">
        <div id="items"></div>
        <button type="button" id="shopBtn"><b id="gold">500</b><span>상점 <kbd>P</kbd></span></button>
      </div>
    </div>

    <div id="stick" hidden><i></i></div>
    <button type="button" id="atkBtn" aria-label="공격">공격</button>
    <div id="tip" hidden></div>
    <div id="dead" hidden><strong>쓰러졌습니다</strong><span id="deadT"></span><small>기다리는 동안 상점(P)에서 장비를 살 수 있습니다.</small></div>

    <section id="shop" class="sheet" hidden>
      <header><h2>상점</h2><span id="shopGold"></span><button type="button" class="x" id="shopX">닫기</button></header>
      <p id="shopNote"></p>
      <div id="shopGrid"></div>
      <h3>가방 <small>누르면 구매가의 60%에 팝니다</small></h3>
      <div id="shopInv"></div>
    </section>

    <section id="score" class="sheet" hidden>
      <header><h2>전적</h2><button type="button" class="x" id="scoreX">닫기</button></header>
      <div class="scroll"><table id="scoreT"></table></div>
    </section>

    <section id="help" class="sheet" hidden>
      <header><h2>조작법</h2><button type="button" class="x" id="helpX">닫기</button></header>
      <dl class="keys"></dl>
    </section>
  </div>

  <div id="menu">
    <div class="panel">
      <p class="eyebrow">5 대 5 공성전 · 봇 9명과 함께</p>
      <h1>로드스타</h1>
      <p class="lede">세 갈래 공격로를 밀고 올라가 적 진영 깊숙한 곳의 <b>로드스톤</b>을 부수면 이깁니다.</p>
      <div id="heroGrid" role="listbox" aria-label="영웅 선택"></div>
      <div id="heroInfo"></div>
      <div class="row">
        <div id="diff" role="radiogroup" aria-label="난이도"></div>
        <button type="button" id="startBtn">전투 시작</button>
      </div>
      <dl class="keys" id="menuKeys"></dl>
    </div>
  </div>

  <div id="end" hidden>
    <div class="panel">
      <h1 id="endTitle"></h1>
      <p id="endSub"></p>
      <div class="scroll"><table id="endT"></table></div>
      <button type="button" id="againBtn">다시 하기</button>
    </div>
  </div>
</div>
<!--/APP-->
<script src="js/data.js"></script>
<script src="js/map.js"></script>
<script src="js/sim.js"></script>
<script src="js/ai.js"></script>
<script src="js/sprites.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
