<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b1417">
<title>로드스타</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!--APP-->
<div id="app">
  <canvas id="cv" aria-label="전장"></canvas>

  <div id="hud" hidden>
    <div id="top">
      <div class="sc ally"><small>아군</small><b id="sa">0</b></div>
      <div id="midtop"><span id="clock">10:00</span><span id="stoneSt">성석 대기</span></div>
      <div class="sc enemy"><b id="sb">0</b><small>적</small></div>
    </div>
    <div id="tools">
      <button type="button" id="scoreBtn" title="전적 (Tab)">전적</button>
      <button type="button" id="muteBtn" title="소리 (M)">소리</button>
      <button type="button" id="helpBtn" title="조작법">?</button>
    </div>
    <div id="feed" aria-live="polite"></div>
    <div id="announce"></div>
    <div id="miniWrap"><canvas id="mini" aria-label="미니맵"></canvas></div>

    <div id="bar">
      <div id="me">
        <div id="portrait"><canvas id="pcv" width="124" height="124"></canvas></div>
        <div id="stats"></div>
      </div>
      <div id="core">
        <div id="skills"></div>
        <div class="vbar hp"><i id="hpf"></i><span id="hpt"></span></div>
      </div>
      <div id="inv"><button type="button" id="throwBtn" hidden>던지기 <kbd>Space</kbd></button></div>
    </div>

    <div id="stick" hidden><i></i></div>
    <button type="button" id="atkBtn" aria-label="공격">공격</button>
    <div id="tip" hidden></div>
    <div id="dead" hidden><strong>쓰러졌습니다</strong><span id="deadT"></span><small>곧 우물에서 다시 일어납니다. 성석을 들고 있었다면 그 자리에 떨어졌습니다.</small></div>

    <section id="score" class="sheet" hidden>
      <header><h2>전적</h2><button type="button" class="x" id="scoreX">닫기</button></header>
      <div class="scroll"><table id="scoreT"></table></div>
    </section>

    <section id="help" class="sheet" hidden>
      <header><h2>조작법</h2><button type="button" class="x" id="helpX">닫기</button></header>
      <dl class="keys"></dl>
    </section>
  </div>

  <div id="menu">
    <div class="panel">
      <p class="eyebrow">5 대 5 성석 운반전 · 봇 9명과 함께</p>
      <h1>로드스타</h1>
      <p class="lede">한가운데의 <b>성석</b>을 집어 우리 <b>제단</b>까지 운반하세요. <b>7점</b>을 먼저 내거나 10분 뒤 앞서면 승리. 레벨도 상점도 없습니다.</p>
      <div id="heroGrid" role="listbox" aria-label="영웅 선택"></div>
      <div id="heroInfo"></div>
      <div class="row">
        <div id="diff" role="radiogroup" aria-label="난이도"></div>
        <button type="button" id="startBtn">전투 시작</button>
      </div>
      <dl class="keys" id="menuKeys"></dl>
    </div>
  </div>

  <div id="end" hidden>
    <div class="panel">
      <h1 id="endTitle"></h1>
      <p id="endSub"></p>
      <div class="scroll"><table id="endT"></table></div>
      <button type="button" id="againBtn">다시 하기</button>
    </div>
  </div>
</div>
<!--/APP-->
<script src="js/data.js"></script>
<script src="js/map.js"></script>
<script src="js/sim.js"></script>
<script src="js/ai.js"></script>
<script src="js/sprites.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
