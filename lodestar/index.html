<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b1417">
<title>로드스타</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!--APP-->
<div id="app">
  <canvas id="cv" aria-label="전장"></canvas>

  <div id="hud" hidden>
    <div id="top">
      <div class="rs ally"><span class="pips" id="pa"></span><small id="aa"></small></div>
      <div id="midtop"><span id="clock"></span><span id="roundSt"></span></div>
      <div class="rs enemy"><small id="ab"></small><span class="pips" id="pb"></span></div>
    </div>
    <div id="tools">
      <button type="button" id="scoreBtn" title="전적 (Tab)">전적</button>
      <button type="button" id="muteBtn" title="소리 (M)">소리</button>
      <button type="button" id="helpBtn" title="조작법">?</button>
    </div>
    <div id="feed" aria-live="polite"></div>
    <div id="announce"></div>
    <div id="miniWrap"><canvas id="mini" aria-label="미니맵"></canvas></div>

    <div id="bar">
      <div id="me">
        <div id="portrait"><canvas id="pcv" width="124" height="124"></canvas></div>
        <div id="stats"></div>
      </div>
      <div id="core">
        <div id="skills"></div>
        <div class="vbar hp"><i id="hpf"></i><span id="hpt"></span></div>
      </div>
      <div id="augs" aria-label="고른 강화"></div>
    </div>

    <section id="pick" hidden>
      <h2 id="pickTitle"></h2>
      <p id="pickSub"></p>
      <div id="pickOpts"></div>
    </section>
    <div id="stick" hidden><i></i></div>
    <button type="button" id="atkBtn" aria-label="공격">공격</button>
    <div id="tip" hidden></div>
    <div id="dead" hidden><strong>쓰러졌습니다</strong><span id="deadT"></span><small>이번 라운드는 아군을 지켜봅니다. 다음 라운드에 다시 싸웁니다.</small></div>

    <section id="score" class="sheet" hidden>
      <header><h2>전적</h2><button type="button" class="x" id="scoreX">닫기</button></header>
      <div class="scroll"><table id="scoreT"></table></div>
    </section>

    <section id="help" class="sheet" hidden>
      <header><h2>조작법</h2><button type="button" class="x" id="helpX">닫기</button></header>
      <dl class="keys"></dl>
    </section>
  </div>

  <div id="menu">
    <div class="panel">
      <p class="eyebrow">5 대 5 섬멸전</p>
      <h1>로드스타</h1>
      <p class="lede">부활 없는 라운드전. 상대 팀을 전멸시키면 라운드를 가져가고, <b>다섯 판</b>을 먼저 따내면 이깁니다.</p>
      <div id="heroGrid" role="listbox" aria-label="영웅 선택"></div>
      <div id="heroInfo"></div>
      <div class="row">
        <div id="diff" role="radiogroup" aria-label="난이도"></div>
        <button type="button" id="startBtn">전투 시작</button>
      </div>
    </div>
  </div>

  <div id="end" hidden>
    <div class="panel">
      <h1 id="endTitle"></h1>
      <p id="endSub"></p>
      <div class="scroll"><table id="endT"></table></div>
      <button type="button" id="againBtn">다시 하기</button>
    </div>
  </div>
</div>
<!--/APP-->
<script src="js/data.js"></script>
<script src="js/map.js"></script>
<script src="js/sim.js"></script>
<script src="js/ai.js"></script>
<script src="js/sprites.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
