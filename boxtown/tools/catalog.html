<!doctype html><meta charset="utf-8"><title>Boxtown asset catalog (dev)</title>
<style>html,body,canvas{margin:0;width:100%;height:100%;display:block;background:#333}</style>
<canvas id="c"></canvas>
<script src="https://cdn.jsdelivr.net/npm/babylonjs@9.37.1/babylon.js"></script>
<script src="https://cdn.jsdelivr.net/npm/babylonjs-loaders@9.37.1/babylonjs.loaders.min.js"></script>
<script>
// Dev tool: ?kit=roads&f=road-&page=0&per=24&cell=2.4  — shows models in a grid with names. Red bar = +X, blue bar = +Z.
(async()=>{
const q=new URLSearchParams(location.search),kit=q.get('kit')||'roads',f=q.get('f')||'',per=+(q.get('per')||24),page=+(q.get('page')||0),cell=+(q.get('cell')||2.4),cols=+(q.get('cols')||6);
const tilt=+(q.get('tilt')||0.9);
const kits=await (await fetch('/__kits.json')).json();
const names=kits[kit].filter(n=>new RegExp(f).test(n)).slice(page*per,page*per+per);
const eng=new BABYLON.Engine(document.getElementById('c'),true),sc=new BABYLON.Scene(eng);sc.clearColor=new BABYLON.Color4(.25,.27,.3,1);
const rows=Math.ceil(names.length/cols);
const cam=new BABYLON.ArcRotateCamera('c',-Math.PI/2-(+(q.get('yaw')??0.5)),tilt,10,new BABYLON.Vector3((cols-1)*cell/2,0,-(rows-1)*cell/2),sc);
cam.mode=BABYLON.Camera.ORTHOGRAPHIC_CAMERA;const hw=cols*cell*0.62,asp=eng.getRenderWidth()/eng.getRenderHeight();
cam.orthoLeft=-hw;cam.orthoRight=hw;cam.orthoTop=hw/asp;cam.orthoBottom=-hw/asp;cam.radius=200;
new BABYLON.HemisphericLight('h',new BABYLON.Vector3(0.3,1,0.2),sc).intensity=1.1;
const d=new BABYLON.DirectionalLight('d',new BABYLON.Vector3(-1,-2,-1),sc);d.intensity=1.5;
for(let i=0;i<names.length;i++){const x=(i%cols)*cell,z=-Math.floor(i/cols)*cell;
  const r=await BABYLON.SceneLoader.ImportMeshAsync('', `../assets/${kit}/`, names[i]+'.glb', sc);
  r.meshes[0].position.set(x,0,z);
  const ax=BABYLON.MeshBuilder.CreateBox('x',{width:.5,height:.03,depth:.03},sc);ax.position.set(x+.25,0.6,z);const mx=new BABYLON.StandardMaterial('',sc);mx.emissiveColor=new BABYLON.Color3(1,0,0);mx.disableLighting=true;ax.material=mx;
  const az=BABYLON.MeshBuilder.CreateBox('z',{width:.03,height:.03,depth:.5},sc);az.position.set(x,0.6,z+.25);const mz=new BABYLON.StandardMaterial('',sc);mz.emissiveColor=new BABYLON.Color3(0,.4,1);mz.disableLighting=true;az.material=mz;
  const t=new BABYLON.DynamicTexture('t',{width:512,height:64},sc);t.drawText(names[i],4,44,'bold 34px monospace','#fff','#000a');
  const pl=BABYLON.MeshBuilder.CreatePlane('l',{width:cell*.95,height:cell*.12},sc);pl.position.set(x,0.02,z-cell*.42);pl.rotation.x=Math.PI/2;
  const pm=new BABYLON.StandardMaterial('',sc);pm.emissiveTexture=t;pm.disableLighting=true;pl.material=pm;pl.renderingGroupId=1;
}
eng.runRenderLoop(()=>sc.render());await sc.whenReadyAsync();window.__ready=true;})();
</script>
