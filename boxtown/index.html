<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>박스타운 (Boxtown) — 프로토타입</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game" touch-action="none"></canvas>

<div id="loading">
  <div class="box">
    <h1>박스타운</h1>
    <p class="sub">네모난 섬마을 오픈 월드 · 프로토타입 M1</p>
    <div class="track"><div id="bar"></div></div>
    <p id="loadText">시작하는 중</p>
  </div>
</div>

<div id="hud" hidden>
  <div class="hint desk walk"><b>WASD</b> 이동 <b>Shift</b> 달리기 <b>Space</b> 점프 <b>E</b> 차 타기 <b>마우스</b> 시점 (화면을 클릭하면 마우스가 고정됩니다)</div>
  <div class="hint desk drive"><b>W</b> 가속 <b>S</b> 브레이크·후진 <b>A D</b> 핸들 <b>Space</b> 사이드 브레이크 <b>E</b> 내리기</div>
  <div id="prompt" hidden><b>E</b><span id="promptText"></span></div>
  <div id="speed" hidden>0<small>km/h</small></div>
  <div class="hint mob">왼쪽을 끌어 이동 · 오른쪽을 끌어 시점</div>
  <div id="fps" hidden></div>
  <div id="stick"><div id="stickKnob"></div></div>
  <button id="btnRun" class="pad" aria-label="달리기">달리기</button>
  <button id="btnJump" class="pad" aria-label="점프">점프</button>
  <button id="btnUse" class="pad" style="visibility:hidden">타기</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/babylonjs@9.37.1/babylon.js"></script>
<script src="https://cdn.jsdelivr.net/npm/babylonjs-loaders@9.37.1/babylonjs.loaders.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babylonjs/havok@1.3.14/lib/umd/HavokPhysics_umd.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
