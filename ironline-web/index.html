<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>Ironline</title>
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
<style>
@font-face{font-family:"IL-Stencil";src:url(assets/fonts/Stencil.ttf);font-display:swap}
@font-face{font-family:"IL-Cond";src:url(assets/fonts/Condensed.ttf);font-display:swap}
@font-face{font-family:"IL-Gothic";src:url(assets/fonts/Gothic.ttf);font-weight:400;font-display:swap}
@font-face{font-family:"IL-Gothic";src:url(assets/fonts/GothicBold.ttf);font-weight:700;font-display:swap}
:root{--a:#5a8cff;--b:#ffc83c;--panel:rgba(12,14,16,.78);--line:rgba(255,255,255,.14);--ok:#7ad06a;--bad:#e8503a;--txt:#eef0f2;--dim:rgba(255,255,255,.55)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:var(--txt);overflow:hidden;font-family:"IL-Gothic","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;user-select:none;-webkit-user-select:none}
canvas#view{position:fixed;inset:0;width:100%;height:100%;display:block}
.num{font-family:"IL-Stencil","IL-Cond","IL-Gothic",sans-serif;letter-spacing:.02em}
#hud{position:fixed;inset:0;pointer-events:none;display:none}
#hud.on{display:block}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px}
#mini{position:absolute;left:14px;top:14px;width:240px;height:134px;border:2px solid rgba(255,255,255,.2);border-radius:6px;background:#1a1e18}
#netinfo{position:absolute;left:16px;top:154px;font-size:13px;color:#fff;background:var(--panel);padding:3px 10px;border-radius:4px}
#top{position:absolute;left:50%;top:12px;transform:translateX(-50%);display:flex;align-items:flex-start;gap:12px}
.tix{display:flex;align-items:center;gap:8px;font-size:30px}
.tix i{display:block;width:210px;height:12px;border-radius:6px;background:rgba(0,0,0,.55);border:2px solid #14171a;overflow:hidden}
.tix i b{display:block;height:100%;width:100%;transition:width .3s}
.tix.a{color:var(--a)}.tix.a i b{background:var(--a)}
.tix.b{color:var(--b)}.tix.b i b{background:var(--b);margin-left:auto}
#pts{display:flex;gap:10px;position:relative;margin-top:-4px}
.hx{position:relative;width:52px;height:56px;display:grid;place-items:center;text-align:center}
.hx svg{position:absolute;inset:0;width:100%;height:100%}
.hx span{position:relative;font-size:24px;line-height:1}
.hx small{position:absolute;left:0;right:0;bottom:-16px;font-size:11px;color:var(--dim)}
#timer{position:absolute;left:0;right:0;top:80px;text-align:center;font-size:19px;color:rgba(255,255,255,.85);text-shadow:0 1px 3px #000}
#cross{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;transition:transform .08s}
#cross:before,#cross:after{content:"";position:absolute;background:#fff;box-shadow:0 0 2px #000}
#cross:before{left:50%;top:0;width:2px;height:100%;margin-left:-1px;-webkit-mask:linear-gradient(#000 0 30%,transparent 30% 70%,#000 70%);mask:linear-gradient(#000 0 30%,transparent 30% 70%,#000 70%)}
#cross:after{top:50%;left:0;height:2px;width:100%;margin-top:-1px;-webkit-mask:linear-gradient(90deg,#000 0 30%,transparent 30% 70%,#000 70%);mask:linear-gradient(90deg,#000 0 30%,transparent 30% 70%,#000 70%)}
#hitm{position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;opacity:0;transition:opacity .15s}
#hitm:before,#hitm:after{content:"";position:absolute;left:50%;top:50%;width:26px;height:3px;margin:-1px 0 0 -13px;background:#fff;transform:rotate(45deg);box-shadow:0 0 3px #000}
#hitm:after{transform:rotate(-45deg)}
#hitm.on{opacity:1;transition:none}#hitm.head:before,#hitm.head:after{background:var(--bad)}
#hp{position:absolute;left:16px;bottom:16px;padding:10px 18px;display:flex;align-items:center;gap:14px;min-width:300px}
#hp .num{font-size:50px;line-height:1}
#hp small{color:var(--dim);font-size:12px;display:block;margin-bottom:3px}
#hp i{display:block;width:180px;height:9px;background:rgba(255,255,255,.14);border-radius:5px;overflow:hidden}
#hp i b{display:block;height:100%;background:var(--ok);transition:width .15s,background .2s}
#ammo{position:absolute;right:16px;bottom:16px;padding:10px 18px;text-align:right;min-width:270px}
#ammo .num{font-size:50px;line-height:1}
#ammo .mag{font-size:22px;color:var(--dim);margin-left:8px}
#ammo small{display:block;color:var(--dim);font-size:11px;margin-top:2px}
#ammo .wn{font-size:14px;color:#fff;margin-bottom:2px}
#ammo.low .num{color:var(--bad)}
#capbox{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);width:380px;padding:8px 16px 12px;text-align:center;font-size:15px;display:none}
#capbox .bar{height:8px;border-radius:4px;margin-top:8px;display:flex;overflow:hidden;background:var(--b)}
#capbox .bar b{background:var(--a);width:50%}
#capbox em{display:block;font-style:normal;color:#ffd08a;font-size:13px;margin-bottom:4px}
#feed{position:absolute;right:16px;top:14px;display:flex;flex-direction:column;gap:4px;align-items:flex-end;font-size:14px}
#feed div{padding:3px 10px;background:var(--panel);border-radius:4px;animation:fin .2s;white-space:nowrap}
#feed .a{color:var(--a)}#feed .b{color:var(--b)}#feed .me{outline:1px solid #fff}
@keyframes fin{from{opacity:0;transform:translateX(20px)}}
#msg{position:absolute;left:0;right:0;top:23%;text-align:center;font-size:26px;text-shadow:0 2px 6px #000;opacity:0;transition:opacity .4s}
#msg.on{opacity:1;transition:none}
#dmg{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(190,20,10,.75) 100%);opacity:0;transition:opacity .5s}
#dmg.on{opacity:1;transition:none}
#low{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 50%,rgba(120,0,0,.5) 100%);opacity:0;transition:opacity .4s}
#death,#deploy{position:absolute;inset:0;display:none}
#death{background:linear-gradient(rgba(5,0,0,.35),rgba(0,0,0,.7))}
#death.on,#deploy.on{display:block}
#death h2{margin:0;position:absolute;left:0;right:0;top:15%;text-align:center;font-size:44px;color:#ea5a44;text-shadow:0 2px 10px #000}
#death .card{position:absolute;left:50%;top:27%;transform:translateX(-50%);width:520px;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;border-left:5px solid var(--b)}
#death .card small{display:block;color:var(--dim);font-size:12px}
#death .card b{font-size:26px}
#death .spec{position:absolute;left:28px;bottom:150px;font-size:17px}
#death .ring{position:absolute;right:50px;bottom:60px;width:110px;height:110px;display:grid;place-items:center;font-size:42px}
#deploy{background:rgba(0,0,0,.3);display:none;place-items:center;font-size:28px}
#deploy.on{display:grid}
#score{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(900px,92vw);padding:14px 18px;display:none}
#score.on{display:block}
#score .cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
#score h3{margin:0 0 6px;font-size:18px}#score .a h3{color:var(--a)}#score .b h3{color:var(--b)}
#score table{width:100%;border-collapse:collapse;font-size:13px}#score td{padding:2px 6px}#score td:nth-child(n+2){text-align:right}
#score tr.me{background:rgba(255,255,255,.14)}
#dbg{position:absolute;left:10px;bottom:4px;font:12px monospace;color:#ffe;display:none}
#overlay{position:fixed;inset:0;display:none;place-items:center;background:radial-gradient(ellipse at 50% 35%,rgba(30,22,14,.55),rgba(5,6,8,.93));z-index:10;overflow:auto}
#overlay.on{display:grid}
.box{width:min(760px,94vw);padding:28px 30px;text-align:center;margin:18px}
.box h1{margin:0;font-size:clamp(46px,9vw,84px);line-height:1;letter-spacing:.06em}
.box h1 span{color:var(--b)}
.box p{margin:10px 0;color:var(--dim);line-height:1.6}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:12px 0}
.opt{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--dim)}
.opt select,.opt input{background:#14171a;color:#fff;border:1px solid var(--line);border-radius:5px;padding:6px 8px;font:inherit}
.wp{flex:1 1 200px;max-width:230px;padding:12px;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.04);cursor:pointer;text-align:left;color:#fff;font:inherit}
.wp b{display:block;font-size:17px}.wp small{color:var(--dim);line-height:1.5}
.wp.on{border-color:var(--b);background:rgba(255,200,60,.1)}
.btn{font:inherit;font-size:22px;letter-spacing:.08em;padding:13px 38px;border:0;border-radius:6px;background:var(--b);color:#1a1405;cursor:pointer;font-weight:700}
.btn:hover{filter:brightness(1.1)}
.btn.sec{background:transparent;color:#fff;border:1px solid var(--line);font-size:16px;padding:10px 22px}
.keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px 14px;text-align:left;margin:10px 0 18px;font-size:13px;color:var(--dim)}
.keys b{color:#fff;background:#2a2f33;border-radius:4px;padding:1px 7px;margin-right:6px;font-weight:400}
#res h2{margin:0;font-size:46px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:14px 0}
.stats div{padding:10px;background:rgba(255,255,255,.06);border-radius:6px}.stats b{display:block;font-size:26px}.stats small{color:var(--dim)}
@media (max-width:760px){#mini{width:150px;height:84px}.tix i{width:90px}.tix{font-size:22px}.hx{width:40px;height:44px}.hx span{font-size:18px}#hp,#ammo{min-width:0;padding:8px 12px}#hp .num,#ammo .num{font-size:34px}#hp i{width:100px}#capbox{width:90vw}}

/* ---- 로비·일시정지·결과 화면: 카툰풍(두꺼운 윤곽선 + 어긋난 그림자) ---- */
:root{--ink:#16110c;--cream:#f5e8c8;--sun:#ffc83c;--orange:#ea6a2a}
#overlay{background:linear-gradient(100deg,rgba(255,236,190,.0) 0%,rgba(22,17,12,.0) 40%,rgba(22,17,12,.35) 100%);place-items:center start;padding-left:clamp(0px,6vw,90px)}
.box.panel{background:var(--cream);color:var(--ink);border:4px solid var(--ink);border-radius:18px;box-shadow:9px 9px 0 var(--ink);backdrop-filter:none}
.box p,.opt,.keys,.wp small,.stats small{color:#5a4a36}
.box h1{color:var(--ink);text-shadow:4px 4px 0 var(--sun);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;letter-spacing:.04em}
.box h1 span{color:var(--orange);text-shadow:4px 4px 0 var(--ink)}
.opt select,.opt input{background:#fff8e6;color:var(--ink);border:2px solid var(--ink);border-radius:8px}
.wp{background:#fff8e6;color:var(--ink);border:3px solid var(--ink);border-radius:12px;box-shadow:4px 4px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.wp:hover{transform:translate(-1px,-1px);box-shadow:6px 6px 0 var(--ink)}
.wp.on{background:var(--sun);border-color:var(--ink)}.wp.on small{color:#3a2c10}
.btn{background:var(--orange);color:#fff;border:3px solid var(--ink);border-radius:12px;box-shadow:5px 5px 0 var(--ink);text-shadow:2px 2px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:hover{filter:none;transform:translate(-1px,-1px);box-shadow:7px 7px 0 var(--ink)}
.btn:active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--ink)}
.btn.sec{background:#fff8e6;color:var(--ink);text-shadow:none}
.keys b{background:var(--ink);color:#fff8e6;border-radius:6px}
.stats div{background:#fff8e6;border:2px solid var(--ink);border-radius:10px}
#res h2{text-shadow:3px 3px 0 var(--ink)}
@media (max-width:760px){#overlay{padding-left:0;place-items:center}}

/* ---- 로비(풀스크린) ---- */
#overlay{place-items:center;padding:0;background:none}
#overlay.lob{background:none}
#menu.lobby{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(18px,4vw,56px);color:#fff;text-align:left;
  background:linear-gradient(90deg,rgba(18,12,6,.66) 0%,rgba(18,12,6,.22) 52%,rgba(18,12,6,0) 100%),linear-gradient(0deg,rgba(18,12,6,.82) 0%,rgba(18,12,6,0) 42%)}
.lb-tag{display:inline-block;background:var(--sun);color:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:4px 18px;font-weight:700;box-shadow:3px 3px 0 var(--ink);transform:rotate(-2deg)}
.lobby h1{font-family:"IL-Gothic",system-ui,sans-serif;font-weight:700;font-style:italic;margin:14px 0 0;font-size:clamp(64px,14vw,160px);line-height:.95;color:#fff;letter-spacing:.03em;text-shadow:3px 0 0 var(--ink),-3px 0 0 var(--ink),0 3px 0 var(--ink),0 -3px 0 var(--ink),2px 2px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink),8px 8px 0 var(--ink)}
.lobby h1 span{color:var(--orange)}
.lb-sub{margin:16px 0 0;max-width:30em;font-size:clamp(15px,1.6vw,20px);line-height:1.6;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.7)}
.lb-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.lb-chips span{background:rgba(18,12,6,.62);border:2px solid rgba(255,255,255,.28);border-radius:999px;padding:5px 14px;font-size:13px}
.lb-bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
.lb-weapons{display:flex;gap:14px;flex-wrap:wrap}
.lobby .wp{flex:0 0 auto;width:clamp(150px,19vw,230px);padding:12px 14px 14px;background:var(--cream);border:3px solid var(--ink);border-radius:14px;box-shadow:5px 5px 0 var(--ink);color:var(--ink)}
.lobby .wp svg{display:block;width:100%;height:46px;margin-bottom:6px}
.lobby .wp b{font-size:17px}
.lobby .wp .st{display:grid;grid-template-columns:34px 1fr;gap:3px 8px;align-items:center;margin-top:8px;font-size:11px;color:#5a4a36}
.lobby .wp .st i{display:block;height:7px;border-radius:4px;background:#d8c9a4;overflow:hidden}
.lobby .wp .st i b{display:block;height:100%;background:var(--ink)}
.lobby .wp.on{background:var(--sun);transform:translate(-2px,-4px);box-shadow:7px 9px 0 var(--ink)}
.lobby .wp.on .st i{background:#e7b934}
.lb-go{text-align:center}
.lobby .btn{font-size:clamp(28px,3.4vw,40px);padding:18px clamp(40px,6vw,84px)}
.lb-note{margin-top:12px;font-size:13px;color:#ffe9c0;text-shadow:0 2px 6px #000}
canvas#view.lobbyfx{filter:saturate(1.25) contrast(1.06)}
@media (max-width:900px){.lb-bottom{flex-wrap:wrap}}
@media (max-width:760px){.lb-bottom{flex-direction:column;align-items:stretch}.lb-go{width:100%}.lobby .btn{width:100%}.lobby .wp{width:calc(33% - 10px);min-width:96px}}

/* 점령 배너 · 능력 표시 · 계정 칩 */
#banner{position:absolute;left:0;right:0;top:27%;text-align:center;font-family:"IL-Gothic",system-ui,sans-serif;font-style:italic;font-weight:700;font-size:clamp(40px,7vw,92px);opacity:0;
  text-shadow:3px 0 0 var(--ink),-3px 0 0 var(--ink),0 3px 0 var(--ink),0 -3px 0 var(--ink),2px 2px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink),7px 7px 0 var(--ink);pointer-events:none}
#banner.on{animation:bn 2.2s ease-out both}
@keyframes bn{0%{opacity:0;transform:scale(.4) rotate(-4deg)}12%{opacity:1;transform:scale(1.18) rotate(-2deg)}22%{transform:scale(1) rotate(-2deg)}78%{opacity:1}100%{opacity:0;transform:scale(1.05) rotate(-2deg) translateY(-12px)}}
#ammo.ready #abil{color:#9ff0a0}
#death .spec small{color:var(--dim);font-size:13px}
.lb-acct{position:absolute;right:clamp(18px,4vw,56px);top:clamp(18px,3vw,40px);display:flex;align-items:center;gap:10px;background:rgba(18,12,6,.66);border:2px solid rgba(255,255,255,.3);border-radius:999px;padding:6px 8px 6px 16px;font-size:14px;color:#fff}
.lb-acct button{font:inherit;background:var(--sun);color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:3px 12px;cursor:pointer;font-weight:700}
.lb-acct b{color:var(--sun)}
.lobby .wp .wd{font-size:12px;color:#5a4a36;margin-top:2px}.lobby .wp.on .wd{color:#3a2c10}
.lobby .wp{width:clamp(112px,11.6vw,158px);padding:10px 11px 12px}
.lb-bottom{flex-wrap:nowrap}.lb-weapons{flex:1 1 auto;min-width:0;flex-wrap:wrap}.lb-go{flex:0 0 auto}
.lobby .wp b{font-size:15px}.lobby .wp .wd{font-size:11px;line-height:1.35}
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="hud">
  <canvas id="mini" width="480" height="268"></canvas>
  <div id="netinfo"></div>
  <div id="top"><div class="tix a num"><span id="ta">250</span><i><b id="tab"></b></i></div><div id="pts"></div><div class="tix b num"><i><b id="tbb"></b></i><span id="tb">250</span></div><div id="timer" class="num">8:00</div></div>
  <div id="feed"></div><div id="msg" class="num"></div><div id="banner" class="num"></div>
  <div id="cross"></div><div id="hitm"></div>
  <div id="hp" class="panel"><div class="num" id="hpn">100</div><div><small>체력</small><i><b id="hpb"></b></i></div></div>
  <div id="ammo" class="panel"><div class="wn" id="wn"></div><div class="num"><span id="am">0</span><span class="mag" id="mg">/ 0</span></div><small id="abil"></small></div>
  <div id="capbox" class="panel"><em id="capwarn"></em><div id="captxt"></div><div class="bar" id="capbar"><b id="capb"></b></div></div>
  <div id="low"></div><div id="dmg"></div>
  <div id="deploy" class="num">투입 중…</div>
  <div id="death"><h2 class="num">처치당함</h2><div class="card panel" id="dcard"></div><div class="spec" id="dspec"></div><div class="ring num" id="dring"></div></div>
  <div id="score" class="panel"></div>
  <div id="dbg"></div>
</div>
<div id="overlay"><div id="menu" class="lobby">
  <div class="lb-acct" id="acct"></div>
  <div class="lb-top">
    <div class="lb-tag">대규모 1인칭 점령전</div>
    <h1 class="num">IRON<span>LINE</span></h1>
    <p class="lb-sub">수십 명이 맞붙는 전선. 거점 5개를 차례로 점령해 적 본진까지 밀어붙여라.</p>
    <div class="lb-chips"><span>팀당 최대 48명</span><span>병과 5종</span><span>온라인 자동 매칭</span></div>
  </div>
  <div class="lb-bottom">
    <div class="lb-weapons" id="wps"></div>
    <div class="lb-go"><button class="btn num" id="go">출격</button><div class="lb-note" id="lbnote">누르면 자동으로 전장에 합류합니다</div></div>
  </div>
  <div id="opts" style="display:none">
  <div class="row">
    <label class="opt">팀당 인원 <select id="per"><option value="16">16 (총 32명)</option><option value="24">24 (총 48명)</option><option value="32" selected>32 (총 64명)</option><option value="48">48 (총 96명)</option></select></label>
    <label class="opt">지형 <select id="tstyle"><option value="block">블록</option><option value="lowpoly">로우폴리</option><option value="toon">카툰</option><option value="paint">수채화</option><option value="real">사실적</option><option value="ps1">레트로 PS1</option></select></label>
    <label class="opt">그래픽 <select id="qual"><option value="0">낮음</option><option value="1" selected>보통</option><option value="2">높음</option></select></label>
    <label class="opt">감도 <input id="sens" type="range" min="1" max="10" value="5"></label>
    <label class="opt">소리 <select id="snd"><option value="1" selected>켜짐</option><option value="0">꺼짐</option></select></label>
  </div>
</div>
