<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0d0f14">
<title>삼원의 등불</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d0f14'/%3E%3Ccircle cx='16' cy='11' r='5' fill='%23ff7a3c'/%3E%3Ccircle cx='10' cy='21' r='5' fill='%235cc8ff'/%3E%3Ccircle cx='22' cy='21' r='5' fill='%23ffd84a'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0d0f14;--panel:#171b23;--panel2:#1f2530;--line:#2a3140;--text:#e8ecf2;--dim:#8b95a5;
  --f:#ff7a3c;--i:#5cc8ff;--s:#ffd84a;--n:#b9a6ff;--acc:#e8b04a;--hp:#e5484d;--ok:#4cc38a;--blk:#6ea8ff;
  --cw:118px;--ch:168px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);overflow:hidden;
  font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
#app{height:100%;height:100dvh;max-width:1000px;margin:0 auto;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* 상단 바 */
#top{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);font-size:14px;min-height:44px}
#top:empty{display:none}
#top .stat{white-space:nowrap;font-variant-numeric:tabular-nums}
#top .where{color:var(--dim);white-space:nowrap}
#top .relics{flex:1;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0}
#top .relics::-webkit-scrollbar{display:none}
.relic{background:none;border:0;padding:2px 3px;font-size:19px;line-height:1;border-radius:6px;flex:none}
.relic:hover{background:var(--panel2)}
.tb{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:13px;white-space:nowrap}
.tb:hover{border-color:var(--acc)}

#main{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.screen{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:16px;padding:22px 14px 28px;text-align:center}
.screen h1{margin:0;font-size:clamp(32px,8vw,54px);letter-spacing:.02em}
.screen h2{margin:0;font-size:22px}
.screen p{margin:0;color:var(--dim);line-height:1.6;max-width:560px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 22px;font-size:16px;min-width:180px}
.btn:hover:not(:disabled){border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#1a1205;font-weight:700}
.btn:disabled{opacity:.4;cursor:default}
.btn small{display:block;color:var(--dim);font-size:12.5px;margin-top:3px}
.btn.pri small{color:#4a3505}
.col{display:flex;flex-direction:column;gap:10px;align-items:stretch;width:100%;max-width:420px}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;width:100%}

/* 제목 화면 */
.title .orbs{font-size:44px;letter-spacing:6px;filter:drop-shadow(0 0 18px rgba(255,160,80,.35))}
.title h1 span:nth-child(1){color:var(--f)}.title h1 span:nth-child(2){color:var(--i)}.title h1 span:nth-child(3){color:var(--s)}
.title{justify-content:center}
.rec{font-size:13px;color:var(--dim)}

/* 인장 고르기 / 문 */
.pickbox{display:flex;flex-direction:column;align-items:center;gap:6px;width:min(100%,250px);padding:18px 14px;background:var(--panel);
  border:1px solid var(--line);border-radius:14px;text-align:center}
.pickbox:hover{border-color:var(--c,var(--acc));transform:translateY(-2px)}
.pickbox{transition:transform .12s,border-color .12s}
.pickbox .big{font-size:40px;line-height:1.1}
.pickbox>b{font-size:18px;color:var(--c,var(--text))}
.pickbox .get b{color:var(--c,var(--text))}
.pickbox small{color:var(--dim);font-size:13px;line-height:1.5}
.pickbox .get{font-size:12.5px;color:var(--text);background:var(--panel2);border-radius:8px;padding:6px 8px;width:100%;line-height:1.5}
.track{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap}
.track i{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:13px;color:var(--dim)}
.track i.done{background:var(--line);color:var(--text)}
.track i.cur{border-color:var(--acc);color:var(--acc);box-shadow:0 0 12px rgba(232,176,74,.5)}

/* 카드 */
.card{position:relative;flex:none;width:var(--cw);height:var(--ch);border-radius:10px;padding:7px 7px 6px;
  background:linear-gradient(170deg,var(--panel2),#12151b);border:2px solid var(--c);
  display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;cursor:pointer;
  box-shadow:0 4px 12px rgba(0,0,0,.45);transition:transform .12s,box-shadow .12s}
.card.el-f{--c:var(--f)}.card.el-i{--c:var(--i)}.card.el-s{--c:var(--s)}.card.el-n{--c:var(--n)}
.card .cost{position:absolute;top:-8px;left:-8px;width:27px;height:27px;border-radius:50%;background:var(--c);color:#111;
  font-weight:800;font-size:15px;display:grid;place-items:center;border:2px solid #0d0f14}
.card .cname{font-weight:700;font-size:13.5px;line-height:1.2;padding:0 12px;white-space:nowrap}
.card.up .cname{color:#8ff0b5}
.card .cart{font-size:30px;line-height:1.15}
.card .ctype{font-size:10.5px;color:var(--c);letter-spacing:.03em}
.card .ctext{font-size:11.5px;line-height:1.38;color:#d6dbe3;margin-top:2px;word-break:keep-all}
.card .ctext b{color:#fff}
.card .ctext .up{color:#8ff0b5;font-weight:700}.card .ctext .down{color:#ff8f8f;font-weight:700}
.card .tag{position:absolute;top:-9px;right:-6px;font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:9px;background:var(--c);color:#111}
.card .price{position:absolute;bottom:-11px;left:50%;transform:translateX(-50%);background:#0d0f14;border:1px solid var(--acc);color:var(--acc);
  border-radius:10px;padding:1px 9px;font-size:12.5px;white-space:nowrap}
.card.sold{opacity:.25;pointer-events:none}
.card.poor .price{border-color:var(--hp);color:var(--hp)}
.card.dim{opacity:.35;cursor:default}
.cards{display:flex;flex-wrap:wrap;gap:20px 14px;justify-content:center;padding:8px 4px}

/* 전투 */
.combat{flex:1;min-height:0;display:flex;flex-direction:column;
  background:radial-gradient(ellipse at 50% 30%,#1b2130 0%,var(--bg) 70%)}
.enemies{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:10px;padding:8px 10px 4px}
.enemy{flex:1;max-width:190px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;border-radius:12px;
  border:2px solid transparent;transition:opacity .4s,transform .15s}
.enemy.targetable{cursor:pointer;border-color:rgba(232,176,74,.55);background:rgba(232,176,74,.07);animation:pulse 1s infinite}
.enemy.dead{opacity:0;pointer-events:none}
.intent{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;font-size:13.5px;min-height:24px;font-weight:700;
  background:rgba(0,0,0,.45);border:1px solid var(--line);border-radius:10px;padding:2px 8px}
.intent .atk{color:#ff9d9d}.intent .def{color:var(--blk)}.intent .buff{color:#8ff0b5}.intent .debuff{color:#d6a5ff}
.eicon{font-size:clamp(44px,11vw,68px);line-height:1.1;filter:drop-shadow(0 6px 8px rgba(0,0,0,.6))}
.ename{font-size:12.5px;color:var(--dim);white-space:nowrap}
.hpbar{position:relative;width:100%;max-width:150px;height:15px;background:#0a0c10;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.hpbar i{position:absolute;inset:0 auto 0 0;background:var(--hp);transition:width .25s}
.hpbar.blk{border-color:var(--blk);box-shadow:0 0 8px rgba(110,168,255,.6)}
.hpbar span{position:absolute;inset:0;font-size:10.5px;line-height:13px;font-weight:700;font-variant-numeric:tabular-nums;text-shadow:0 1px 2px #000}
.sts{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;min-height:19px;font-size:12px}
.sts span{background:rgba(0,0,0,.5);border-radius:7px;padding:0 5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.sts .b{color:var(--blk);font-weight:700}

.mid{display:flex;align-items:center;gap:10px;padding:4px 12px}
.player{display:flex;align-items:center;gap:8px;flex:1;min-width:0;border-radius:12px;padding:4px}
.player .pi{font-size:38px;line-height:1}
.player .pinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;align-items:flex-start;max-width:230px}
.player .hpbar{max-width:none}
.player .sts{justify-content:flex-start}
.warn{font-size:12px;color:#ff9d9d;white-space:nowrap}
.warn.safe{color:#8ff0b5}
.chainbox{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:92px;padding:5px 10px;border-radius:12px;border:1px solid var(--line);background:var(--panel)}
.chainbox small{font-size:10.5px;color:var(--dim)}
.chainbox .pips{font-size:17px;letter-spacing:1px;min-height:23px;line-height:23px}
.chainbox.on{border-color:var(--c);box-shadow:0 0 14px -4px var(--c)}
.chainbox.on small{color:var(--c)}

.ctrl{display:flex;align-items:center;gap:8px;padding:4px 12px}
.pile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px;white-space:nowrap}
.pile:hover{border-color:var(--acc)}
.energy{width:50px;height:50px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;font-size:19px;
  background:radial-gradient(circle at 35% 30%,#fff3c4,var(--acc) 55%,#8a5a10);color:#231703;border:2px solid #0d0f14;box-shadow:0 0 16px rgba(232,176,74,.5)}
.energy.zero{filter:grayscale(.9) brightness(.6);box-shadow:none}
.endturn{margin-left:auto;background:var(--panel2);border:1px solid var(--acc);color:var(--acc);border-radius:12px;padding:11px 18px;font-size:15px;font-weight:700}
.endturn:hover:not(:disabled){background:var(--acc);color:#1a1205}
.endturn.go{background:var(--acc);color:#1a1205;animation:pulse 1.1s infinite}
.endturn:disabled{opacity:.4;animation:none}
.sp{flex:1}

.hand{display:flex;justify-content:center;align-items:flex-end;padding:22px 14px 12px;min-height:calc(var(--ch) + 34px)}
.hand .card.no{filter:brightness(.55) saturate(.6)}
.hand .card.res{box-shadow:0 0 0 2px var(--c),0 0 20px var(--c)}
.hand .card.shift::after{content:'전환';position:absolute;top:-9px;right:-6px;font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:9px;background:#fff;color:#111}
.hand .card.res::after{content:'공명 +' attr(data-r);position:absolute;top:-9px;right:-6px;font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:9px;background:var(--c);color:#111}
.hand .card{transform-origin:50% 100%}
.hand .card:first-child{transform-origin:0 100%}.hand .card:last-child{transform-origin:100% 100%}
.hand .card.sel{transform:translateY(-34px) scale(1.18);z-index:60;box-shadow:0 0 0 2px #fff,0 12px 30px rgba(0,0,0,.7)}
.hand .card+.card{margin-left:min(8px,calc((100% - var(--n) * var(--cw)) / (var(--n) - 1)))}
.hand .card.new{animation:drawin .22s ease-out}
@media (hover:hover){
  .hand .card:hover{transform:translateY(-22px) scale(1.1);z-index:50}
  .hand .card.sel:hover{transform:translateY(-34px) scale(1.18);z-index:60}
}
.hint{font-size:12.5px;color:var(--dim);text-align:center;min-height:18px;padding:0 10px}

/* 효과 */
#fxlayer{position:fixed;inset:0;pointer-events:none;z-index:200;overflow:hidden}
.float{position:absolute;font-weight:800;font-size:22px;text-shadow:0 2px 4px #000,0 0 2px #000;transform:translate(-50%,-50%);animation:floatup .9s ease-out forwards;white-space:nowrap}
.float.hit{color:#ff6b6b}.float.blocked{color:#9fb3cc;font-size:16px}.float.block{color:var(--blk);font-size:18px}
.float.heal{color:#6ee7a4}.float.st{color:#e6d3ff;font-size:16px}.float.say{color:var(--acc);font-size:18px}
.hurt{animation:shake .28s}
.lunge{animation:lunge .3s}
.dying{animation:die .5s forwards}
@keyframes floatup{0%{opacity:0;margin-top:8px}15%{opacity:1}100%{opacity:0;margin-top:-54px}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
@keyframes lunge{0%,100%{transform:translateY(0)}45%{transform:translateY(22px) scale(1.08)}}
@keyframes die{to{opacity:0;transform:scale(.6) rotate(8deg)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(232,176,74,.45)}50%{box-shadow:0 0 0 6px rgba(232,176,74,0)}}
@keyframes drawin{from{opacity:0;transform:translateY(40px)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}

/* 모달 / 알림 */
#modal{position:fixed;inset:0;z-index:300;background:rgba(5,6,9,.82);display:none;align-items:center;justify-content:center;padding:14px}
#modal.on{display:flex}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px;max-width:760px;width:100%;max-height:100%;display:flex;flex-direction:column}
.sheet header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.sheet header b{flex:1;font-size:16px}
.sheet .body{overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}
.help{text-align:left;font-size:14.5px;line-height:1.7;color:#d6dbe3}
.help h3{margin:14px 0 4px;font-size:15.5px;color:var(--acc)}.help h3:first-child{margin-top:0}
.help p{margin:0 0 6px}.help b{color:#fff}
.help .f{color:var(--f)}.help .i{color:var(--i)}.help .s{color:var(--s)}
#toast{position:fixed;left:50%;bottom:calc(var(--ch) + 80px);transform:translateX(-50%);z-index:400;background:#000d;border:1px solid var(--line);
  border-radius:12px;padding:9px 14px;font-size:13.5px;max-width:min(92vw,420px);text-align:center;opacity:0;transition:opacity .2s;pointer-events:none;line-height:1.5}
#toast.on{opacity:1}

.eventicon{font-size:64px;line-height:1}
.gain{display:flex;flex-direction:column;gap:6px;font-size:15px}
.gain span{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 14px}
.shoprel{display:flex;align-items:center;gap:10px;text-align:left;min-width:0;width:100%;max-width:420px}
.shoprel .big{font-size:26px}
.shoprel span{flex:1;text-align:left;font-size:13px;color:var(--dim);line-height:1.4}
.shoprel span b{display:block;color:var(--text);font-size:14.5px}
.shoprel em{font-style:normal;color:var(--acc);white-space:nowrap}

@media (max-width:640px){
  :root{--cw:100px;--ch:150px}
  #top{gap:7px;padding:6px 8px;font-size:13px}
  #top .where b{display:none}
  .card .cname{font-size:12.5px;padding:0 10px}.card .cart{font-size:24px}.card .ctext{font-size:10.5px;line-height:1.32}
  .card .ctype{font-size:10px}
  .mid{padding:2px 8px;gap:6px}.ctrl{padding:4px 8px;gap:6px}
  .player .pi{font-size:30px}
  .chainbox{min-width:76px;padding:4px 6px}
  .hand{padding:26px 8px 10px}
  .hand .card.sel{transform:translateY(-12px) scale(1.2)}
  .hand.many .card:not(.sel):not(:last-child){align-items:flex-start;text-align:left}
  .hand.many .card:not(.sel):not(:last-child) .cname{padding:0 0 0 17px}
  .pickbox{width:100%;padding:12px}.pickbox .big{font-size:30px}
  .screen{gap:12px;padding:16px 12px 24px}
  .endturn{padding:10px 13px;font-size:14px}
  .pile{padding:6px 8px;font-size:12.5px}
}
@media (max-height:620px){
  :root{--cw:96px;--ch:140px}
  .eicon{font-size:40px}
  .card .cart{font-size:20px}
}
</style>
</head>
<body>
<div id="app">
  <header id="top"></header>
  <main id="main"></main>
</div>
<div id="fxlayer"></div>
<div id="modal"></div>
<div id="toast"></div>
<script src="core.js"></script>
<script src="ui.js"></script>
</body>
</html>
