<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a0c11">
<title>삼원의 등불</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d0f14'/%3E%3Ccircle cx='16' cy='11' r='5' fill='%23ff7a3c'/%3E%3Ccircle cx='10' cy='21' r='5' fill='%235cc8ff'/%3E%3Ccircle cx='22' cy='21' r='5' fill='%23ffd84a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#0a0c11;--panel:#151a23;--panel2:#1d2430;--line:#2b3342;--text:#ece8df;--dim:#8f96a4;
  --f:#ff7a3c;--i:#5cc8ff;--s:#ffd84a;--n:#b9a6ff;--acc:#e8b04a;--acc2:#ffd98a;--hp:#e5484d;--ok:#4cc38a;--blk:#6ea8ff;
  --cw:124px;--ch:184px;
  --disp:"Do Hyeon","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);overflow:hidden;font-family:var(--body);
  user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
#app{height:100%;height:100dvh;max-width:1032px;margin:0 auto;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.ic{width:20px;height:20px;flex:none;display:block}

/* 상단 바 */
#top{display:flex;align-items:center;gap:12px;padding:7px 12px;background:linear-gradient(#1a202b,#11151c);border-bottom:1px solid var(--line);min-height:46px;position:relative;z-index:5}
#top:empty{display:none}
.res{display:flex;align-items:center;gap:5px;font-family:var(--disp);font-size:17px;white-space:nowrap;font-variant-numeric:tabular-nums}
.where{font-size:13px;color:var(--dim);white-space:nowrap}
.where b{font-family:var(--disp);font-weight:400;color:var(--acc2);font-size:15px}
.relics{flex:1;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0;padding:2px}
.relics::-webkit-scrollbar{display:none}
.relic{flex:none;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 40% 30%,#2e3748,#171c26);border:1px solid #3a4456;font-size:16px;line-height:1;display:grid;place-items:center;padding:0}
.relic:hover{border-color:var(--acc)}
.tb{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:5px 10px;font-family:var(--disp);font-size:15px;white-space:nowrap}
.tb:hover{border-color:var(--acc)}

#main{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.screen{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:16px;padding:22px 14px 28px;text-align:center;position:relative}
.screen h1{margin:0;font-family:var(--disp);font-weight:400;font-size:clamp(40px,10vw,68px);letter-spacing:.04em;line-height:1.05}
.screen h2{margin:0;font-family:var(--disp);font-weight:400;font-size:26px;letter-spacing:.03em}
.screen p{word-break:keep-all;margin:0;color:var(--dim);line-height:1.65;max-width:560px;font-size:14.5px}
.btn{position:relative;font-family:var(--disp);font-size:19px;letter-spacing:.02em;padding:12px 22px;min-width:190px;color:var(--text);
  background:linear-gradient(#272f3d,#1a212c);border:1px solid #3b4659;border-radius:12px;
  box-shadow:0 2px 0 #090b0f,inset 0 1px 0 rgba(255,255,255,.08);transition:transform .1s,border-color .1s,box-shadow .1s}
.btn:hover:not(:disabled){border-color:var(--acc);transform:translateY(-1px)}
.btn:active:not(:disabled){transform:translateY(1px);box-shadow:0 0 0 #090b0f}
.btn.pri{background:linear-gradient(#f3c870,#d29a36);color:#251607;border-color:#f8dc97;box-shadow:0 2px 0 #7a5214,0 0 24px rgba(232,176,74,.28),inset 0 1px 0 rgba(255,255,255,.45)}
.btn:disabled{opacity:.4;cursor:default}
.btn small{display:block;font-family:var(--body);color:var(--dim);font-size:12.5px;margin-top:3px;letter-spacing:0}
.btn.pri small{color:#5a3d0a}
.col{display:flex;flex-direction:column;gap:10px;align-items:stretch;width:100%;max-width:420px}
.row{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 13px;font-size:14px;white-space:nowrap}
.chip b{font-family:var(--disp);font-weight:400;font-size:16px}
.chip.gold{border-color:rgba(232,176,74,.5);color:var(--acc2)}

/* 제목 화면 */
.tscr{justify-content:center;overflow:hidden}
.tbg{position:absolute;inset:0;width:100%;height:100%}
.tin{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
.logo{width:min(260px,62vw);height:auto;overflow:visible;filter:drop-shadow(0 0 26px rgba(255,170,90,.4))}
.tscr h1 span:nth-child(1){color:var(--f)}.tscr h1 span:nth-child(2){color:var(--i)}.tscr h1 span:nth-child(3){color:var(--s)}
.tscr h1{text-shadow:0 4px 0 #0007,0 0 30px rgba(255,150,70,.25)}
.rec{font-size:13px;color:var(--dim)}

/* 인장 */
.ascrow{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap}
.ascrow span{font-size:13px;color:var(--dim);margin-right:4px}
.ascrow button{width:36px;height:36px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);font-family:var(--disp);font-size:16px}
.ascrow button.on{background:var(--acc);color:#251607;border-color:var(--acc2)}
.ascrow button:disabled{opacity:.3;cursor:default}
.ascnote{font-size:12.5px!important;min-height:18px;color:#ffb0a0!important}
.seal{display:flex;flex-direction:column;align-items:center;gap:8px;width:min(100%,260px);padding:18px 14px 16px;text-align:center;
  background:radial-gradient(ellipse at 50% 0%,color-mix(in srgb,var(--c) 22%,transparent),transparent 62%),linear-gradient(#171c26,#10141b);
  border:1px solid color-mix(in srgb,var(--c) 45%,#2b3342);border-radius:18px;transition:transform .14s,box-shadow .14s}
.seal:hover{transform:translateY(-4px);box-shadow:0 10px 30px -8px var(--c)}
.seal .sealart svg{width:62px;height:82px;overflow:visible}
.seal>b{font-family:var(--disp);font-weight:400;font-size:21px;color:var(--c)}
.seal>small{color:var(--dim);font-size:13px;line-height:1.55;word-break:keep-all}
.seal .get{width:100%;text-align:left;font-size:12.5px;line-height:1.5;background:rgba(0,0,0,.28);border-radius:10px;padding:7px 10px;color:#d6dbe3;word-break:keep-all}
.seal .get b{color:var(--c);font-family:var(--disp);font-weight:400;font-size:14px}

/* 지도 */
.mapscr{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 12px 10px;text-align:center}
.maphead h2{margin:0;font-family:var(--disp);font-weight:400;font-size:24px}
.maphead p{margin:2px 0 0;font-size:13px;color:var(--dim)}
.mapbox{flex:1;min-height:0;width:100%;max-width:600px;position:relative}
.mapbox svg{width:100%;height:100%;display:block;overflow:visible}
.node{transition:opacity .2s}
.node .ring{transition:stroke-width .12s}
.node.dim{opacity:.32}
.node.done{opacity:.55}
.node.reach{cursor:pointer}
.node.reach .glow{animation:nodepulse 1.3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.node.reach:hover .body{transform:scale(1.14)}
.node .body{transition:transform .12s;transform-box:fill-box;transform-origin:center}
.node.cur .glow{animation:nodepulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes nodepulse{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:.9;transform:scale(1.18)}}
.edge{stroke:#3a4456;stroke-width:2;fill:none;stroke-linecap:round}
.edge.walked{stroke:var(--acc);stroke-width:3}
.edge.next{stroke:#cfd6e4;stroke-dasharray:5 6;animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-22}}
.legend{display:flex;gap:6px 12px;flex-wrap:wrap;justify-content:center;font-size:12px;color:var(--dim)}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend svg{width:18px;height:18px}
.mapcap{min-height:20px;font-size:13px;color:var(--text)}

/* 카드 */
.card{position:relative;flex:none;width:var(--cw);height:var(--ch);border-radius:12px;padding:7px 7px 8px;
  background:linear-gradient(165deg,#272f3f 0%,#171c26 55%,#11151c 100%);border:2px solid var(--c);
  display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;cursor:pointer;
  box-shadow:0 6px 16px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.07),inset 0 -26px 24px -20px color-mix(in srgb,var(--c) 30%,transparent);
  transition:transform .12s,box-shadow .12s}
.card.el-f{--c:var(--f)}.card.el-i{--c:var(--i)}.card.el-s{--c:var(--s)}.card.el-n{--c:var(--n)}
.card .cost{position:absolute;top:-9px;left:-9px;width:30px;height:30px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff 0%,var(--c) 45%,color-mix(in srgb,var(--c) 55%,#000) 100%);color:#10131a;
  font-family:var(--disp);font-size:18px;display:grid;place-items:center;border:2px solid #0a0c11;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.card .cname{font-family:var(--disp);font-size:15.5px;line-height:1.2;padding:0 12px;white-space:nowrap;letter-spacing:.01em}
.card.up .cname{color:#8ff0b5}
.card .cart{width:100%;height:52px;flex:none;border-radius:7px;overflow:hidden;border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 0 10px rgba(0,0,0,.55)}
.card .cart svg{display:block;width:100%;height:100%}
.card .ctype{font-size:10.5px;color:var(--c);letter-spacing:.04em}
.card .ctext{font-size:11.5px;line-height:1.4;color:#d9dde6;margin-top:1px;word-break:keep-all}
.card .ctext b{color:#fff}
.card .ctext .up{color:#8ff0b5;font-weight:700}.card .ctext .down{color:#ff8f8f;font-weight:700}
.card .gem{position:absolute;bottom:-6px;left:50%;width:11px;height:11px;transform:translateX(-50%) rotate(45deg);background:var(--rc,#6a7284);border:1.5px solid #0a0c11}
.card.rar1{--rc:#9ad0ff}.card.rar2{--rc:#ffd84a;box-shadow:0 0 0 1px rgba(255,216,74,.55),0 6px 16px rgba(0,0,0,.5),0 0 18px rgba(255,216,74,.22),inset 0 -26px 24px -20px color-mix(in srgb,var(--c) 30%,transparent)}
.card .tag{position:absolute;top:-10px;right:-6px;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:9px;background:var(--c);color:#111}
.card .price{position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);background:#0a0c11;border:1px solid var(--acc);color:var(--acc2);display:flex;align-items:center;gap:4px;
  border-radius:12px;padding:1px 10px 1px 6px;font-family:var(--disp);font-size:15px;white-space:nowrap;z-index:2}
.card .price .ic{width:15px;height:15px}
.card.sold{opacity:.25;pointer-events:none}
.card.poor .price{border-color:var(--hp);color:#ff9a9d}
.card.dim{opacity:.32;cursor:default}
.card.locked{filter:grayscale(1) brightness(.6)}
.cards{display:flex;flex-wrap:wrap;gap:24px 16px;justify-content:center;padding:10px 4px 14px}
.cards.big{gap:26px 22px}
.cards.big .card{--cw:136px;--ch:200px}
.cards.big .card .cart{height:58px}.cards.big .card .ctext{font-size:12.5px}

/* 전투 */
.combat{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.stage{flex:1;min-height:0;display:flex;flex-direction:column-reverse;justify-content:flex-end;position:relative}
.enemies{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 6px 0}
.enemy{flex:1;max-width:240px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;border-radius:14px;
  border:2px solid transparent;transition:opacity .4s}
.enemy.targetable{cursor:pointer;border-color:rgba(232,176,74,.6);background:rgba(232,176,74,.08);animation:pulse 1s infinite}
.enemy.dead{opacity:0;pointer-events:none;flex:0 0 0;min-width:0;max-width:0;padding:0;margin:0 -4px;overflow:visible}
.intent{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;font-family:var(--disp);font-size:17px;min-height:28px;align-items:center;
  background:rgba(8,10,14,.7);border:1px solid #3a4456;border-radius:12px;padding:2px 10px}
.intent .charge{color:#ffd27a}.intent .atk{color:#ff9d9d}.intent .def{color:var(--blk)}.intent .buff{color:#8ff0b5}.intent .debuff{color:#d6a5ff}
.eicon{width:clamp(78px,24vw,132px);aspect-ratio:1;animation:bob 3.2s ease-in-out var(--bd,0s) infinite}
.eicon.elite{width:clamp(92px,28vw,150px)}.eicon.boss{width:clamp(120px,38vw,210px)}
.eicon svg{display:block;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 8px 10px rgba(0,0,0,.55))}
.enemy.hurt .eicon svg{animation:flashw .3s}
.enemy.dying .eicon{animation:none}
.enemy.enter .eicon{animation:enter .6s cubic-bezier(.2,.9,.3,1.25) backwards,bob 3.2s ease-in-out var(--bd,0s) infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes enter{from{opacity:0;transform:translateY(-40px) scale(.7)}}
@keyframes flashw{0%{filter:brightness(3) saturate(.2)}100%{filter:brightness(1)}}
.ename{font-family:var(--disp);font-size:14px;color:#c4c9d4;white-space:nowrap}
.aff{display:flex;gap:5px;justify-content:center;min-height:19px}
.aff span{font-size:12px;padding:0 6px;border-radius:8px;background:rgba(8,10,14,.7);border:1px solid #3a4456;white-space:nowrap}
.aff .w{color:#ffe08a;border-color:rgba(255,216,74,.55)}.aff .r{color:#9aa2b4}
.hpbar{position:relative;width:100%;max-width:150px;height:17px;background:#07080b;border:1px solid #3a4456;border-radius:9px;overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,.6)}
.hpbar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(#ff6a6f,#c93036);transition:width .25s;border-radius:9px 0 0 9px}
.hpbar.blk{border-color:var(--blk);box-shadow:0 0 10px rgba(110,168,255,.55),inset 0 2px 4px rgba(0,0,0,.6)}
.hpbar span{position:absolute;inset:0;font-family:var(--disp);font-size:12.5px;line-height:16px;font-variant-numeric:tabular-nums;text-shadow:0 1px 2px #000,0 0 3px #000;letter-spacing:.02em}
.sts{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;min-height:21px;font-size:12.5px}
.sts span{background:rgba(8,10,14,.7);border:1px solid #2b3342;border-radius:8px;padding:0 6px;white-space:nowrap;font-variant-numeric:tabular-nums}
.sts .b{color:var(--blk);border-color:rgba(110,168,255,.5);font-weight:700}

.player{display:flex;align-items:center;gap:10px;padding:6px 8px}
.player .pi{width:44px;height:58px;flex:none;position:relative}
.player .pi::after{content:'';position:absolute;left:-6px;right:-6px;bottom:-4px;height:8px;border-radius:50%;background:rgba(0,0,0,.5);filter:blur(2px);z-index:-1}
.lant{display:block;width:100%;height:100%;overflow:visible}
.lflame{transform-origin:30px 62px;animation:flick .9s ease-in-out var(--bd,0s) infinite}
@keyframes flick{0%,100%{transform:scale(1,1)}35%{transform:scale(.94,1.1)}70%{transform:scale(1.05,.96)}}
.pinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;align-items:flex-start;max-width:230px}
.pinfo .hpbar{max-width:none}
.pinfo .sts{justify-content:flex-start}
.warn{font-size:12.5px;color:#ff9d9d;white-space:nowrap}
.warn.safe{color:#8ff0b5}
.chainbox{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:96px;margin-left:auto;padding:5px 10px;border-radius:12px;border:1px solid var(--line);background:rgba(15,19,26,.85)}
.chainbox small{font-size:10.5px;color:var(--dim)}
.chainbox .pips{font-size:17px;letter-spacing:1px;min-height:23px;line-height:23px}
.chainbox.on{border-color:var(--c);box-shadow:0 0 16px -4px var(--c)}
.chainbox.on small{color:var(--c)}
.hint{font-size:12.5px;color:var(--dim);text-align:center;min-height:18px;padding:0 10px}

.ctrl{display:flex;align-items:center;gap:8px;padding:4px 12px}
.pile{display:flex;align-items:center;gap:6px;background:rgba(21,26,35,.9);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-family:var(--disp);font-size:15px;white-space:nowrap}
.pile:hover{border-color:var(--acc)}
.energy{width:56px;height:56px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--disp);font-size:26px;
  background:radial-gradient(circle at 35% 30%,#fff3c4,var(--acc) 50%,#8a5a10);color:#231703;border:2px solid #0a0c11;box-shadow:0 0 18px rgba(232,176,74,.55)}
.energy.zero{filter:grayscale(.9) brightness(.6);box-shadow:none}
.endturn{margin-left:auto;font-family:var(--disp);background:linear-gradient(#272f3d,#1a212c);border:1px solid var(--acc);color:var(--acc2);border-radius:12px;padding:11px 20px;font-size:18px;letter-spacing:.03em}
.endturn:hover:not(:disabled){background:linear-gradient(#f3c870,#d29a36);color:#251607}
.endturn.go{background:linear-gradient(#f3c870,#d29a36);color:#251607;animation:pulse 1.1s infinite}
.endturn:disabled{opacity:.4;animation:none}

.hand{display:flex;justify-content:center;align-items:flex-end;padding:24px 14px 12px;min-height:calc(var(--ch) + 36px)}
.hand .card{transform-origin:50% 100%}
.hand .card.no{filter:brightness(.55) saturate(.6)}
.hand .card.res{box-shadow:0 0 0 2px var(--c),0 0 22px var(--c)}
.hand .card.shift::after{content:'전환';position:absolute;top:-10px;right:-6px;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:9px;background:#fff;color:#111}
.hand .card.res::after{content:'공명 +' attr(data-r);position:absolute;top:-10px;right:-6px;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:9px;background:var(--c);color:#111}
.hand .card.sel{transform:translateY(-34px) scale(1.18);z-index:60;box-shadow:0 0 0 2px #fff,0 12px 30px rgba(0,0,0,.7)}
.hand .card+.card{margin-left:min(8px,calc((100% - var(--n) * var(--cw)) / (var(--n) - 1)))}
.hand .card.new{animation:drawin .22s ease-out}
.card .wk{position:absolute;left:-6px;bottom:14px;z-index:3;font-size:11px;font-weight:700;padding:1px 6px;border-radius:8px;background:#ffd84a;color:#2a1f00;border:1px solid #0a0c11}
.card .wk.rs{background:#6a7284;color:#e8e6df}
.card .pin{position:absolute;right:-7px;bottom:12px;z-index:4;width:26px;height:26px;border-radius:50%;padding:0;font-size:13px;line-height:1;display:none;place-items:center;background:#1d2430;border:1px solid #4a5670}
.card .pin:hover{border-color:var(--acc)}
.hand .card:hover .pin,.hand .card.sel .pin,.hand .card.held .pin{display:grid}
.hand .card.held{box-shadow:0 0 0 2px var(--acc),0 0 18px rgba(232,176,74,.55)}
.hand .card.held .pin{background:var(--acc);border-color:var(--acc2)}
@keyframes drawin{from{opacity:0;transform:translateY(40px)}}
@media (hover:hover){
  .hand .card:hover{transform:translateY(-24px) scale(1.1);z-index:50}
  .hand .card.sel:hover{transform:translateY(-34px) scale(1.18);z-index:60}
}

/* 분위기 */
.combat.act0{background:radial-gradient(ellipse at 50% 100%,rgba(255,110,50,.16),transparent 60%),radial-gradient(ellipse at 50% 25%,#2a1a16 0%,#0d0f14 75%)}
.combat.act1{background:radial-gradient(ellipse at 50% 100%,rgba(92,200,255,.16),transparent 60%),radial-gradient(ellipse at 50% 25%,#152336 0%,#0b0e14 75%)}
.combat.act2{background:radial-gradient(ellipse at 50% 100%,rgba(170,120,255,.2),transparent 60%),radial-gradient(ellipse at 50% 25%,#1e1a38 0%,#0c0b16 75%)}
.combat.boss::after{content:'';position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 110px rgba(255,40,40,.2)}
.combat[data-chain=f]{box-shadow:inset 0 -80px 80px -60px rgba(255,122,60,.22)}
.combat[data-chain=i]{box-shadow:inset 0 -80px 80px -60px rgba(92,200,255,.22)}
.combat[data-chain=s]{box-shadow:inset 0 -80px 80px -60px rgba(255,216,74,.2)}
.chainbox.pulse{animation:pop .4s}
@keyframes pop{40%{transform:scale(1.18)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(232,176,74,.45)}50%{box-shadow:0 0 0 6px rgba(232,176,74,0)}}
#vig{position:fixed;inset:0;pointer-events:none;z-index:185;opacity:0}
.ghost{position:fixed;z-index:250;pointer-events:none;margin:0!important;transform-origin:center;box-shadow:0 0 24px var(--c)}
.bigtext{position:absolute;z-index:5;font-family:var(--disp);letter-spacing:.03em;white-space:nowrap;transform:translate(-50%,-50%);text-shadow:0 0 14px currentColor,0 3px 6px #000;animation:bigpop 1s ease-out forwards}
@keyframes bigpop{0%{opacity:0;transform:translate(-50%,-30%) scale(.4)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.25)}35%{transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-140%) scale(1)}}
.banner{position:absolute;left:0;right:0;top:30%;display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 0;background:linear-gradient(90deg,transparent,rgba(0,0,0,.8) 20%,rgba(0,0,0,.8) 80%,transparent);animation:banner 1.9s ease-out forwards}
.banner small{letter-spacing:.5em;font-size:13px;color:#ff8a8a}.banner.elite small{color:#e0f0ff}
.banner b{font-family:var(--disp);font-weight:400;font-size:clamp(28px,7vw,48px);letter-spacing:.06em;text-shadow:0 0 22px rgba(255,80,80,.7)}
@keyframes banner{0%{opacity:0;transform:scaleY(.2)}12%{opacity:1;transform:scaleY(1)}80%{opacity:1}100%{opacity:0}}

/* 효과 */
#fxlayer{position:fixed;inset:0;pointer-events:none;z-index:200;overflow:hidden}
.float{position:absolute;font-family:var(--disp);font-size:26px;text-shadow:0 2px 4px #000,0 0 2px #000;transform:translate(-50%,-50%);animation:floatup .9s ease-out forwards;white-space:nowrap}
.float.weak{color:#ffd84a;font-size:34px;text-shadow:0 0 14px rgba(255,216,74,.8),0 2px 4px #000}.float.resist{color:#9aa2b4;font-size:20px}
.float.hit{color:#ff6b6b}.float.blocked{color:#9fb3cc;font-size:18px}.float.block{color:var(--blk);font-size:20px}
.float.heal{color:#6ee7a4}.float.st{color:#e6d3ff;font-size:18px}.float.say{color:var(--acc);font-size:20px}
.hurt{animation:shake .28s}
.lunge{animation:lunge .3s}
.dying{animation:die .5s forwards}
@keyframes floatup{0%{opacity:0;margin-top:8px}15%{opacity:1}100%{opacity:0;margin-top:-54px}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
@keyframes lunge{0%,100%{transform:translateY(0)}45%{transform:translateY(22px) scale(1.08)}}
@keyframes die{to{opacity:0;transform:scale(.6) rotate(8deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}

/* 장면 화면 */
.scene{width:min(300px,72vw);height:auto;overflow:visible}
.cf1{transform-origin:110px 100px;animation:cf 1.1s ease-in-out infinite}
.cf2{transform-origin:110px 100px;animation:cf 0.8s ease-in-out infinite reverse}
.cf3{transform-origin:110px 100px;animation:cf 0.6s ease-in-out infinite}
@keyframes cf{0%,100%{transform:scale(1,1)}40%{transform:scale(.95,1.08)}70%{transform:scale(1.04,.96)}}
.tiles{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;width:100%}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;width:min(236px,44vw);min-width:150px;padding:18px 12px 16px;background:linear-gradient(#1d2430,#141a23);
  border:1px solid #303b4d;border-radius:16px;transition:transform .12s,border-color .12s,box-shadow .12s}
.tile:hover:not(:disabled){border-color:var(--acc);transform:translateY(-3px);box-shadow:0 10px 26px -10px rgba(232,176,74,.5)}
.tile:disabled{opacity:.4;cursor:default}
.tile .ic{width:48px;height:48px}
.tile b{font-family:var(--disp);font-weight:400;font-size:20px}
.tile small{color:var(--dim);font-size:12.5px;line-height:1.5;word-break:keep-all}
.shelf{display:flex;flex-wrap:wrap;justify-content:center;gap:24px 16px;padding:22px 12px 28px;width:100%;max-width:860px;background:linear-gradient(#171c26,#10141b);border:1px solid var(--line);border-radius:18px}
.reltiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;width:100%;max-width:860px}
.rtile{display:flex;align-items:center;gap:10px;text-align:left;width:min(100%,278px);padding:10px 14px;background:linear-gradient(#1d2430,#141a23);border:1px solid #303b4d;border-radius:14px}
.rtile:hover:not(:disabled){border-color:var(--acc)}
.rtile:disabled{opacity:.38;cursor:default}
.rtile .rm{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:22px;background:radial-gradient(circle at 40% 30%,#2e3748,#171c26);border:1px solid #3a4456}
.rtile .rm .ic{width:24px;height:24px}
.rtile span{flex:1;font-size:12.5px;color:var(--dim);line-height:1.45;min-width:0}
.rtile span b{display:block;font-family:var(--disp);font-weight:400;color:var(--text);font-size:15.5px}
.rtile em{font-style:normal;display:flex;align-items:center;gap:4px;font-family:var(--disp);color:var(--acc2);white-space:nowrap;font-size:16px}
.rtile em .ic{width:16px;height:16px}
.medal{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;font-size:56px;flex:none;
  background:radial-gradient(circle at 50% 38%,#2d3548,#131822 72%);border:2px solid var(--acc);box-shadow:0 0 36px rgba(232,176,74,.25),inset 0 0 20px rgba(0,0,0,.5)}
.story{max-width:540px;width:100%;text-align:left;padding:14px 18px;background:#11151d;border-left:3px solid var(--acc);border-radius:0 12px 12px 0;line-height:1.75;font-size:15px;color:#d6dbe3;word-break:keep-all}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px;width:100%;max-width:540px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 6px}
.stat b{display:block;font-family:var(--disp);font-weight:400;font-size:26px;color:var(--acc2)}
.stat small{color:var(--dim);font-size:12px}
.emberline{display:flex;align-items:center;gap:8px;justify-content:center;font-family:var(--disp);font-size:20px;color:#ffb27a}
.emberline .ic{width:24px;height:24px}
.unlockgrid .card .price{border-color:var(--ok);color:#9ff0c8}

/* 창 / 알림 */
#modal{position:fixed;inset:0;z-index:300;background:rgba(5,6,9,.84);display:none;align-items:center;justify-content:center;padding:14px}
#modal.on{display:flex}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:18px;max-width:780px;width:100%;max-height:100%;display:flex;flex-direction:column}
.sheet header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.sheet header b{flex:1;font-family:var(--disp);font-weight:400;font-size:19px}
.sheet .body{overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}
.help{text-align:left;font-size:14.5px;line-height:1.7;color:#d6dbe3}
.help h3{margin:14px 0 4px;font-family:var(--disp);font-weight:400;font-size:17px;color:var(--acc)}.help h3:first-child{margin-top:0}
.help p{margin:0 0 6px}.help b{color:#fff}
.help .f{color:var(--f)}.help .i{color:var(--i)}.help .s{color:var(--s)}
#toast{position:fixed;left:50%;bottom:calc(var(--ch) + 80px);transform:translateX(-50%);z-index:400;background:#000d;border:1px solid var(--line);
  border-radius:12px;padding:9px 14px;font-size:13.5px;max-width:min(92vw,420px);text-align:center;opacity:0;transition:opacity .2s;pointer-events:none;line-height:1.5}
#toast.on{opacity:1}

/* 넓은 화면: 왼쪽 플레이어, 오른쪽 적의 무대 + 부채꼴 손패 */
@media (min-width:760px){
  .stage{flex-direction:row;justify-content:flex-start;align-items:stretch;padding:0 18px}
  .player{flex:0 0 250px;flex-direction:column;justify-content:flex-end;gap:10px;padding:0 10px 30px}
  .player .pi{width:84px;height:112px}
  .pinfo{flex:0 0 auto;width:100%;align-items:center;max-width:none}
  .pinfo .sts{justify-content:center}
  .chainbox{margin-left:0;min-width:140px}
  .enemies{align-items:flex-end;padding-bottom:26px;gap:14px}
  .eicon{width:clamp(110px,15vw,160px)}.eicon.elite{width:clamp(130px,18vw,185px)}.eicon.boss{width:clamp(180px,26vw,270px)}
  .stage::after{content:'';position:absolute;left:18px;right:18px;bottom:16px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.14),transparent)}
}
@media (min-width:760px) and (hover:hover){
  .hand{padding-bottom:22px}
  .hand .card{transform:translateY(var(--ly,0px)) rotate(var(--rot,0deg))}
  .hand .card:hover{transform:translateY(-30px) rotate(0deg) scale(1.12);z-index:50}
  .hand .card.sel,.hand .card.sel:hover{transform:translateY(-40px) rotate(0deg) scale(1.18);z-index:60}
}
@media (max-width:640px){
  :root{--cw:104px;--ch:158px}
  #top{gap:8px;padding:6px 8px}
  .where{display:none}
  .card .cname{font-size:13.5px;padding:0 10px}.card .cart{height:42px}.card .ctext{font-size:10.5px;line-height:1.32}
  .card .ctype{font-size:10px}
  .ctrl{padding:4px 8px;gap:6px}
  .chainbox{min-width:80px;padding:4px 6px}
  .hand{padding:26px 8px 10px}
  .hand .card.sel{transform:translateY(-12px) scale(1.2)}
  .hand.many .card:not(.sel):not(:last-child){align-items:flex-start;text-align:left}
  .hand.many .card:not(.sel):not(:last-child) .cname{padding:0 0 0 17px}
  .endturn{padding:10px 14px;font-size:17px}
  .pile{padding:6px 8px}
  .screen{gap:12px;padding:16px 12px 24px}
  .cards.big .card{--cw:112px;--ch:170px}
  .cards.big .card .cart{height:46px}.cards.big .card .ctext{font-size:11px}
  .seal{width:100%;padding:14px 12px}.seal .sealart svg{width:48px;height:64px}
}
@media (max-height:620px){
  :root{--cw:96px;--ch:140px}
  .eicon{width:64px}
  .card .cart{height:34px}
}
</style>
</head>

<div id="app">
  <header id="top"></header>
  <main id="main"></main>

<div id="fxlayer"></div>
<div id="modal"></div>
<div id="toast"></div>

<script src="art.js"></script>
<script src="fx.js"></script>
