name: Prototypes site build and deploy

# main 에 반영되면 사이트(site/) + Ironline 웹 빌드 + FF Script + 로드스타 + 삼원의 등불을 한 묶음으로 GitHub Pages 에 올린다.
# 수동 실행(workflow_dispatch)도 가능. 처음 한 번 Settings → Pages → Source 를 "GitHub Actions" 로 바꿔야 한다.
on:
  push:
    branches: [main]
    paths:
      - "ironline/**"
      - "ffscript/**"
      - "lodestar/**"
      - "trilantern/**"
      - "site/**"
      - ".github/workflows/ironline-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Install export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/4.3.stable
      - name: Import and export Web build
        working-directory: ironline
        run: |
          mkdir -p build/web
          godot --headless --import || true
          godot --headless --export-release Web build/web/index.html
          ls -la build/web
      - name: Assemble site
        run: |
          mkdir -p _site/ironline _site/ffscript _site/lodestar/js _site/trilantern
          cp -r site/. _site/
          cp -r ironline/build/web/. _site/ironline/
          cp ffscript/index.html _site/ffscript/index.html
          cp lodestar/index.html lodestar/style.css _site/lodestar/
          cp lodestar/js/*.js _site/lodestar/js/
          cp trilantern/index.html trilantern/core.js trilantern/art.js trilantern/fx.js trilantern/ui.js _site/trilantern/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
