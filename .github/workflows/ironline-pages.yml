name: Prototypes site build and deploy

# main 에 반영되면 사이트(site/) + Ironline 웹 빌드 + FF Script + 로드스타 + 잔향의 탑 + 삼원의 등불 + 박스타운을 한 묶음으로 GitHub Pages 에 올린다.
# 수동 실행(workflow_dispatch)도 가능. 처음 한 번 Settings → Pages → Source 를 "GitHub Actions" 로 바꿔야 한다.
on:
  push:
    branches: [main]
    paths:
      - "ironline/**"
      - "ffscript/**"
      - "lodestar/**"
      - "resonance/**"
      - "kitchendefense/**"
      - "trilantern/**"
      - "boxtown/**"
      - "site/**"
      - ".github/workflows/ironline-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Install export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/4.3.stable
      - name: Import and export Web build
        working-directory: ironline
        run: |
          mkdir -p build/web
          godot --headless --import || true
          godot --headless --export-release Web build/web/index.html
          ls -la build/web
      - name: Assemble site
        run: |
          mkdir -p _site/ironline _site/ffscript _site/lodestar/js _site/resonance _site/kitchendefense _site/trilantern
          cp -r site/. _site/
          cp -r ironline/build/web/. _site/ironline/
          cp ffscript/index.html _site/ffscript/index.html
          cp lodestar/index.html lodestar/style.css _site/lodestar/
          cp lodestar/js/*.js _site/lodestar/js/
          cp resonance/index.html _site/resonance/index.html
          cp kitchendefense/index.html kitchendefense/logo.svg _site/kitchendefense/
          cp trilantern/index.html trilantern/core.js trilantern/art.js trilantern/fx.js trilantern/ui.js _site/trilantern/
          mkdir -p _site/boxtown
          cp boxtown/index.html boxtown/style.css _site/boxtown/
          cp -r boxtown/js boxtown/assets _site/boxtown/
          # 박스타운: 배포할 때마다 스크립트·스타일 주소에 커밋 번호를 붙인다.
          # 브라우저와 CDN이 예전 파일을 4시간씩 붙들고 있어서, 주소가 바뀌어야 새 버전이 바로 보인다.
          V=$(echo "$GITHUB_SHA" | cut -c1-8)
          sed -i -E "s#(from '\./[a-z]+\.js)'#\1?v=$V'#" _site/boxtown/js/*.js
          sed -i -E "s#js/main\.js#js/main.js?v=$V#; s#style\.css#style.css?v=$V#" _site/boxtown/index.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
