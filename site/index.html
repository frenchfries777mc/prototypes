<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>Prototypes</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0d10'/%3E%3Cpath d='M9 22V10l7 8 7-8v12' fill='none' stroke='%23e8b04a' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{--bg:#0b0d10;--panel:#14181d;--line:#232a32;--text:#e9edf1;--dim:#8a94a0;--acc:#e8b04a}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
body{display:flex;flex-direction:column}
#home{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 16px;gap:28px}
h1{margin:0;font-size:clamp(28px,6vw,44px);letter-spacing:.04em;font-weight:700}
h1 b{color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;width:100%;max-width:720px}
.card{display:flex;flex-direction:column;gap:10px;padding:22px;background:var(--panel);border:1px solid var(--line);border-radius:14px;color:inherit;text-decoration:none;cursor:pointer;text-align:left;font:inherit}
.card:hover,.card:focus-visible{border-color:var(--acc);outline:none}
.card h2{margin:0;font-size:22px}
.card p{margin:0;color:var(--dim);font-size:15px;line-height:1.5}
.card span{margin-top:auto;color:var(--acc);font-size:14px}
#view{display:none;flex:1;flex-direction:column;min-height:0}
body.run #home{display:none}
body.run #view{display:flex}
.bar{display:flex;align-items:center;gap:8px;padding:6px 10px;padding-top:max(6px,env(safe-area-inset-top));background:var(--panel);border-bottom:1px solid var(--line)}
.bar b{flex:1;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar button,.bar a{font:inherit;font-size:14px;color:var(--text);background:#1c222a;border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;text-decoration:none}
.bar button:hover,.bar a:hover{border-color:var(--acc)}
iframe{flex:1;width:100%;border:0;background:#000;min-height:0}
</style>
</head>
<body>
<main id="home">
  <h1>PROTO<b>TYPES</b></h1>
  <div class="grid">
    <a class="card" href="#ironline">
      <h2>Ironline</h2>
      <p>1인칭 3D 거점 점령전. 3v3 + 봇.</p>
      <span>실행 →</span>
    </a>
    <a class="card" href="#ffscript">
      <h2>FF Script</h2>
      <p>스크립트를 쓰면 바로 게임이 돌아가는 편집기.</p>
      <span>실행 →</span>
    </a>
    <a class="card" href="#trilantern">
      <h2>삼원의 등불</h2>
      <p>불·서리·번개 카드를 엮어 심연을 내려가는 덱 빌딩 로그라이크.</p>
      <span>실행 →</span>
    </a>
  </div>
</main>
<section id="view">
  <div class="bar">
    <button id="back" type="button">← 목록</button>
    <b id="title"></b>
    <a id="tab" target="_blank" rel="noopener">새 탭</a>
    <button id="fs" type="button">전체화면</button>
  </div>
  <iframe id="frame" title="" allow="fullscreen; autoplay; gamepad; clipboard-write; clipboard-read"></iframe>
</section>
<script>
(function(){
  var APPS={ironline:{t:'Ironline',u:'ironline/'},ffscript:{t:'FF Script',u:'ffscript/'},trilantern:{t:'삼원의 등불',u:'trilantern/'}};
  var frame=document.getElementById('frame'),cur='';
  var join=new URLSearchParams(location.search).get('join');
  if(join&&!location.hash)location.hash='#ironline';
  function route(){
    var k=location.hash.slice(1),a=APPS[k];
    if(!a){cur='';frame.removeAttribute('src');document.body.classList.remove('run');document.title='Prototypes';return;}
    if(cur!==k){
      cur=k;
      var u=a.u+(k==='ironline'&&join?'?join='+encodeURIComponent(join):'');
      frame.src=u;frame.title=a.t;
      document.getElementById('tab').href=u;
    }
    document.getElementById('title').textContent=a.t;
    document.title=a.t+' · Prototypes';
    document.body.classList.add('run');
  }
  document.getElementById('back').onclick=function(){
    location.hash='';
  };
  document.getElementById('fs').onclick=function(){
    var f=frame.requestFullscreen||frame.webkitRequestFullscreen;
    if(f)try{f.call(frame);}catch(e){}
  };
  window.addEventListener('hashchange',route);
  route();
})();
</script>
</body>
</html>
