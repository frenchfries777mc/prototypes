<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>루멘 와일즈</title>
<style>
  :root { --panel: rgba(16, 22, 30, 0.82); --line: #3b4a5c; --text: #e8eef4; --dim: #9fb0c0; --accent: #ffd166; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #101820; color: var(--text);
    font: 13px/1.4 "Pretendard", "Noto Sans KR", system-ui, sans-serif; user-select: none; }
  #game { position: fixed; left: 0; top: 0; image-rendering: pixelated; image-rendering: crisp-edges; }
  .panel { position: fixed; background: var(--panel); border: 2px solid var(--line); border-radius: 4px; padding: 8px 10px; }
  #login { inset: 0; margin: auto; width: 300px; height: fit-content; text-align: center; padding: 22px; z-index: 10; }
  #login h1 { margin: 0 0 4px; font-size: 22px; letter-spacing: 2px; color: var(--accent); }
  #login p { margin: 0 0 14px; color: var(--dim); }
  input, button { font: inherit; color: var(--text); background: #1c2733; border: 2px solid var(--line); border-radius: 3px; padding: 6px 8px; }
  input:focus { outline: none; border-color: var(--accent); }
  button { cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: 0.45; cursor: default; }
  #login input { width: 100%; margin-bottom: 8px; text-align: center; }
  #login button { width: 100%; }
  #status { margin-top: 8px; min-height: 18px; color: #ff8a80; }
  #hud { left: 12px; top: 12px; width: 220px; }
  .bar { height: 12px; background: #0c1218; border: 1px solid var(--line); margin: 3px 0 6px; position: relative; }
  .bar > i { display: block; height: 100%; width: 0; }
  #hp > i { background: #e5484d; } #xp > i { background: #4ea8de; }
  .bar > span { position: absolute; inset: 0; text-align: center; font-size: 10px; line-height: 11px; text-shadow: 0 1px 0 #000; }
  #inv { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin: 6px 0; text-align: center; }
  #inv div { background: #0c1218; border: 1px solid var(--line); padding: 2px 0; }
  #inv small { display: block; color: var(--dim); font-size: 10px; }
  #craft button { display: block; width: 100%; margin-top: 4px; text-align: left; font-size: 12px; }
  #craft small { color: var(--dim); }
  #chat { left: 12px; bottom: 12px; width: 320px; }
  #chatlog { height: 110px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; user-select: text; }
  #chatlog div { overflow-wrap: anywhere; } #chatlog .sys { color: var(--accent); } #chatlog b { color: #8ecae6; }
  #chatinput { width: 100%; margin-top: 6px; }
  #mapwrap { right: 12px; top: 12px; width: 132px; height: 132px; padding: 0; border-radius: 50%; overflow: hidden; }
  #minimap { width: 180px; height: 180px; margin: -26px; transform: rotate(45deg); image-rendering: pixelated; }
  #net { right: 12px; top: 150px; padding: 2px 8px; color: var(--dim); font-size: 11px; }
  #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .label { position: absolute; transform: translate(-50%, -100%); white-space: nowrap; font-size: 11px; text-shadow: 0 1px 0 #000, 0 0 3px #000; text-align: center; }
  .label .mini { width: 34px; height: 4px; background: #000a; margin: 1px auto 0; } .label .mini i { display: block; height: 100%; background: #e5484d; }
  .dmg { position: absolute; transform: translate(-50%, -50%); font-weight: 700; font-size: 14px; color: #fff; text-shadow: 0 1px 0 #000, 0 0 4px #000; }
  .dmg.me { color: #ff6b6b; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="labels"></div>
<div id="hud" class="panel hidden">
  <div><b id="who"></b> · 레벨 <b id="level">1</b></div>
  <div class="bar" id="hp"><i></i><span></span></div>
  <div class="bar" id="xp"><i></i><span></span></div>
  <div id="inv"></div>
  <div id="craft"></div>
</div>
<div id="mapwrap" class="panel hidden"><canvas id="minimap" width="90" height="90"></canvas></div>
<div id="net" class="panel hidden"></div>
<div id="chat" class="panel hidden">
  <div id="chatlog"></div>
  <input id="chatinput" maxlength="120" placeholder="Enter 키로 채팅" autocomplete="off" />
</div>
<form id="login" class="panel">
  <h1>루멘 와일즈</h1>
  <p>함께 채집하고, 싸우고, 성장하는 온라인 월드</p>
  <input id="name" maxlength="16" placeholder="이름" autocomplete="off" />
  <button type="submit">입장</button>
  <div id="status"></div>
</form>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
