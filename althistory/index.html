<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Althist · 대체역사 시뮬레이터</title>
  </head>
  <body class="phase-intro">
    <div id="map"></div>

    <!-- 1단계: 흰 배경 시작 화면 (템플릿 + AI 방식) -->
    <section id="intro">
      <div class="wrap">
        <header class="i-head">
          <h1>Althist</h1>
          <p>실제 세계지도 위에서 한 나라를 골라 자유롭게 역사를 바꾸는 AI 대체역사 시뮬레이터. 이름 있는 장군과 군대를 이끌고 전쟁을 치릅니다.</p>
          <div class="i-tools">
            <button type="button" id="btn-studio" class="lbtn">🛠 템플릿 스튜디오 (직접 만들기)</button>
            <button type="button" id="btn-tpl-import" class="lbtn">📥 템플릿 파일 불러오기</button>
            <button type="button" id="btn-gallery" class="lbtn">🌐 공유 템플릿 갤러리</button>
            <input id="tpl-file" type="file" accept="application/json,.json" hidden />
          </div>
          <div id="gallery" class="gallery" hidden></div>
        </header>

        <div id="intro-s1">
          <h2><span>1</span> 시나리오 템플릿</h2>
          <div id="tpl-hero" class="hero"></div>
          <div id="tpl-filter" class="tpl-filter"></div>
          <div id="tpl-grid" class="tpl-grid"><div class="lhint">불러오는 중…</div></div>
          <div id="tpl-actions" class="tpl-actions" hidden></div>
          <div class="i-actions sticky">
            <button type="button" id="btn-continue" class="lbtn" hidden></button>
            <button type="button" id="btn-to-ai" class="lprimary">다음: AI 선택 →</button>
          </div>
        </div>

        <div id="intro-s2" hidden>
          <h2><span>2</span> AI와 난이도 선택</h2>
          <div id="s2-sum" class="s2-sum"></div>
          <div id="intro-ai"></div>
          <div class="i-actions">
            <button type="button" id="btn-to-tpl" class="lbtn">← 템플릿 다시 고르기</button>
            <button type="button" id="btn-next" class="lprimary" disabled>다음: 지도에서 나라 고르기 →</button>
          </div>
        </div>
        <div id="intro-msg" class="lmsg">데이터 불러오는 중…</div>
      </div>
    </section>

    <!-- 2~3단계: 지도 + 왼쪽 나라 카드 -->
    <aside id="panel" hidden>
      <div class="p-head"><h1>Althist</h1><button type="button" id="btn-back" class="ghost small">← 템플릿</button></div>
      <div id="p-hint" class="p-hint">지도에서 <b>플레이할 나라를 클릭</b>하세요.</div>
      <div id="info" class="info empty"></div>
      <div id="status" class="status"></div>
    </aside>

    <aside id="game" hidden>
      <header class="g-head">
        <div><div class="g-country"><i class="swatch" id="g-swatch"></i><b id="g-name"></b></div><div class="g-date" id="g-date"></div></div>
        <button type="button" id="btn-menu" class="ghost">메뉴</button>
      </header>
      <div id="g-stats" class="g-stats"></div>
      <div id="g-goals" class="g-goals"></div>
      <div id="g-diplo" class="g-diplo"></div>
      <div id="g-news" class="g-news">
        <button type="button" id="btn-paper" class="paper-btn"><span class="pb-ic">📰</span><span class="pb-tx"><small>이번 호 신문</small><b id="g-latest">아직 발행된 신문이 없습니다</b></span></button>
        <button type="button" id="btn-archive" class="ghost small">📚 지난 신문</button>
      </div>
      <section class="g-orders">
        <div class="g-orders-h"><b>명령</b><span class="hint">군대를 눌러 고르고, 지도에서 목표 주를 누른 뒤 이동·공격 버튼을 눌러 보세요. 직접 써도 됩니다.</span></div>
        <div id="g-army" class="g-army"></div>
      </section>
      <form id="g-form" class="g-form">
        <textarea id="g-cmd" rows="3" placeholder="명령 입력 (Ctrl+Enter)"></textarea>
        <div id="g-suggest" class="g-suggest" hidden></div>
        <div class="g-actions">
          <button type="button" id="btn-undo" class="ghost">되돌리기</button>
          <button type="button" id="btn-pass" class="ghost">명령 없이 넘기기</button>
          <button type="submit" id="btn-go" class="primary">턴 진행 ▶</button>
        </div>
        <div id="g-msg" class="g-msg"></div>
      </form>
    </aside>

    <!-- 메뉴 (게임 중) -->
    <aside id="studio" hidden></aside>

    <div id="overlay" class="modal" hidden>
      <div class="card">
        <h2>메뉴</h2>
        <section><label>AI와 난이도</label><div id="ov-ai"></div></section>
        <section>
          <label>저장 / 불러오기</label>
          <div class="row">
            <button type="button" id="ov-export" class="ghost">파일로 내보내기</button>
            <button type="button" id="ov-import" class="ghost">파일 불러오기</button>
            <input id="ov-file" type="file" accept="application/json,.json" hidden />
          </div>
          <div class="hint">진행 상황은 매 턴 자동 저장됩니다.</div>
        </section>
        <div class="btns">
          <button type="button" id="ov-studio" class="ghost" hidden>🛠 스튜디오로 돌아가기</button>
          <button type="button" id="ov-newgame" class="ghost">새 게임 (템플릿 선택으로)</button>
          <button type="button" id="ov-close" class="ghost">닫기</button>
          <button type="button" id="ov-apply" class="primary">설정 적용</button>
        </div>
        <div id="ov-msg" class="g-msg"></div>
      </div>
    </div>

    <!-- 신문: 턴이 끝나면 큰 신문 한 장이 펼쳐진다 -->
    <div id="ending" class="ending" hidden><div class="ending-box"><div class="ending-kind" id="ending-kind"></div><h2 id="ending-title"></h2><p id="ending-text"></p><div class="ending-btns"><button type="button" id="ending-ok" class="primary">확인</button></div></div></div>
    <div id="paper" class="paper-modal" hidden>
      <div class="paper-wrap">
        <div class="paper-bar">
          <button type="button" id="paper-prev" class="ghost small">← 이전 호</button><span id="paper-pos" class="paper-pos"></span><button type="button" id="paper-next" class="ghost small">다음 호 →</button>
          <label class="paper-auto"><input type="checkbox" id="paper-auto" checked /> 매 턴 자동으로 펼치기</label>
          <button type="button" id="paper-close" class="primary">닫고 계속 ▶</button>
        </div>
        <div id="paper-scroll" class="paper-scroll"><div id="paper-sheet" class="paper-sheet"></div></div>
      </div>
    </div>
    <div id="archive" class="modal" hidden>
      <div class="card"><h2>지난 신문</h2><div id="archive-list" class="arch-list"></div><div class="btns"><button type="button" id="archive-close" class="ghost">닫기</button></div></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
