<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FF Script</title>
<style>
:root{--bg:#0e0f1a;--panel:#161828;--line:#262a44;--text:#e8eaf6;--dim:#8b90b0;--accent:#6fb3ff;--err:#ff6b81;--ok:#5be3a0}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif}
body{display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:18px;margin:0 8px 0 0;letter-spacing:.5px}
header h1 b{color:var(--accent)}
select,button{font:inherit;color:var(--text);background:#20243d;border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover,select:hover{border-color:var(--accent)}
.spacer{flex:1}
#status{font-size:13px;color:var(--dim)}
#status.ok{color:var(--ok)}
main{flex:1;display:grid;grid-template-columns:minmax(320px,42%) 1fr;min-height:0}
.left{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
.ed{flex:1;display:flex;min-height:0;position:relative}
#gutter{width:44px;padding:14px 0;text-align:right;color:#4b5075;font:14px/22px ui-monospace,"SF Mono",Menlo,Consolas,monospace;overflow:hidden;background:#12142200;user-select:none;white-space:pre}
#gutter div{padding-right:10px}
#gutter .bad{background:#ff6b8133;color:var(--err)}
.wrap{flex:1;position:relative;min-width:0}
#hl,#code{position:absolute;inset:0;margin:0;border:0;padding:14px 14px 14px 4px;font:14px/22px ui-monospace,"SF Mono",Menlo,Consolas,monospace;tab-size:2;white-space:pre;letter-spacing:0}
#hl{overflow:hidden;pointer-events:none;color:var(--text)}
#code{resize:none;outline:0;background:transparent;color:transparent;caret-color:#fff;overflow:auto}
#code::selection{background:#4d8dff55;color:transparent}
.k{color:#ff9ac1;font-weight:600}.c{color:#7fd6ff}.l{color:#ffd479}.w{color:#b9a3ff}.n{color:#8df0b0}.s{color:#a6e68a}.m{color:#5d6390;font-style:italic}.o{color:#8b90b0}
#ac{display:none;position:absolute;z-index:5;min-width:150px;max-height:200px;overflow:auto;background:#1d2140;border:1px solid #3a4070;border-radius:8px;padding:4px;box-shadow:0 10px 30px #000a;font:13px/1.2 ui-monospace,"SF Mono",Menlo,Consolas,monospace}
#ac div{padding:5px 10px;border-radius:5px;cursor:pointer;color:var(--text)}
#ac div.on{background:#3b4a8f}
#ac small{color:var(--dim);margin-left:10px;font-family:inherit}
canvas:fullscreen{max-width:none;width:100vw;height:100vh;border-radius:0;box-shadow:none;object-fit:contain}
header button.ic{padding:7px 10px}
#tut{display:none;padding:12px 16px;background:#1b2144;border-bottom:1px solid #343c78;font-size:14px;line-height:1.55}
#tut b{color:#ffe680}
#tut .tb{display:flex;gap:8px;margin-top:10px;align-items:center}
#tut .tb span{margin-left:auto;color:var(--dim);font-size:12px}
#helpBtn{position:absolute;right:12px;top:10px;z-index:4;padding:5px 11px;font-size:13px;background:#20243dcc;backdrop-filter:blur(4px)}
#help{display:none;position:absolute;right:12px;top:48px;z-index:4;width:min(380px,calc(100% - 24px));max-height:calc(100% - 64px);overflow:auto;background:#161a33f2;border:1px solid #3a4070;border-radius:12px;padding:6px 14px 14px;box-shadow:0 14px 40px #000b;backdrop-filter:blur(6px)}
#help h3{margin:14px 0 6px;font-size:13px;color:var(--accent);letter-spacing:.3px}
#help .row{display:flex;gap:10px;align-items:baseline;padding:4px 6px;border-radius:6px;cursor:pointer;font-size:13px}
#help .row:hover{background:#2a3060}
#help .row code{font:12.5px ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:#e8eaf6;white-space:pre;flex:none}
#help .row span{color:var(--dim);margin-left:auto;text-align:right}
#help p{margin:8px 0 0;font-size:12px;color:var(--dim);line-height:1.5}
#conv{display:none;position:absolute;inset:10px;z-index:6;flex-direction:column;gap:8px;background:#161a33f5;border:1px solid #3a4070;border-radius:12px;padding:12px;box-shadow:0 14px 40px #000b}
#conv textarea{flex:1;resize:none;background:#0e1022;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;font:13px/1.5 ui-monospace,"SF Mono",Menlo,Consolas,monospace;outline:0}
#conv div{display:flex;gap:8px;justify-content:flex-end}
#convMsg{margin-right:auto;align-self:center;font-size:13px;color:var(--dim)}
#err{display:none;margin:0;padding:12px 16px;background:#3a1522;color:#ffc2cc;border-top:1px solid #6b2a3d;font-size:14px;line-height:1.5;white-space:pre-wrap;max-height:34%;overflow:auto}
#err b{color:#fff}
.right{display:flex;align-items:center;justify-content:center;padding:16px;min-width:0;min-height:0;background:radial-gradient(circle at 50% 40%,#1a1d33,#0b0c16)}
canvas{width:100%;max-width:calc((100vh - 120px)*16/9);aspect-ratio:16/9;border-radius:14px;box-shadow:0 20px 60px #000a,0 0 0 1px #ffffff14;background:#000;display:block}
button,select{white-space:nowrap}
@media(max-width:820px){header{flex-wrap:wrap;gap:8px}#status{display:none}main{grid-template-columns:1fr;grid-template-rows:auto 1fr}.left{border-right:0;border-bottom:1px solid var(--line);height:46vh}.right{padding:10px}canvas{max-width:100%}}
</style>
</head>
<body>
<header>
  <h1>FF <b>Script</b></h1>
  <select id="ex"></select>
  <button id="restart">다시 시작</button>
  <button id="save" class="ic" title="내 게임으로 저장">💾</button>
  <button id="del" class="ic" title="저장한 게임 지우기" hidden>🗑</button>
  <button id="tutBtn">🎓 튜토리얼</button>
  <button id="convBtn" title="HTML·JavaScript를 FF Script로 바꾸기">🔄 JS→FF</button>
  <span class="spacer"></span>
  <span id="status"></span>
  <button id="share" class="ic" title="코드가 담긴 링크 복사">🔗</button>
  <button id="shot" class="ic" title="스크린샷 저장">📷</button>
  <button id="full" class="ic" title="전체화면">⛶</button>
  <button id="export">HTML로 저장</button>
</header>
<main>
  <section class="left">
    <div id="tut"></div>
    <div class="ed"><div id="gutter"></div><div class="wrap"><pre id="hl"></pre><textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"></textarea><div id="ac"></div></div>
      <button id="helpBtn">📖 명령어</button><div id="help"></div>
      <div id="conv"><textarea id="convIn" spellcheck="false" placeholder="HTML이나 JavaScript 코드를 붙여 넣으세요"></textarea><div><span id="convMsg"></span><button id="convClose">닫기</button><button id="convGo">변환</button></div></div></div>
    <pre id="err"></pre>
  </section>
  <section class="right"><canvas id="game" width="960" height="540"></canvas></section>
</main>
<script type="text/plain" id="rt-src">(function (global) {
'use strict';
const W = 960, H = 540, TAU = Math.PI * 2;
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const choose = a => a[Math.floor(Math.random() * a.length)];

const COLORS = {
  red: '#ff4d5e', orange: '#ff9a3c', yellow: '#ffd93d', green: '#4ade80', blue: '#4d8dff',
  navy: '#4b5bd6', purple: '#a66bff', pink: '#ff7ac6', white: '#ffffff', black: '#1a1a22',
  gray: '#9aa0ad', grey: '#9aa0ad', gold: '#ffcb3d', cyan: '#5ee7ff', sky: '#6fd3ff', brown: '#a86b45'
};
const own = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
function color(c) { return own(COLORS, c) ? COLORS[c] : String(c); }
function shade(hex, f) {
  let h = hex.replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const n = parseInt(h, 16);
  let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  if (f >= 0) { r += (255 - r) * f; g += (255 - g) * f; b += (255 - b) * f; }
  else { r *= 1 + f; g *= 1 + f; b *= 1 + f; }
  return `rgb(${r | 0},${g | 0},${b | 0})`;
}
function rgba(hex, a) {
  let h = hex.replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const n = parseInt(h, 16);
  return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`;
}

/* ---------- sound ---------- */
const MUSIC = {
  chill: { tempo: 260, wave: 'sine', vol: 0.05, bassEvery: 8, bass: [131, 110, 87, 98], lead: [523, 0, 659, 0, 784, 659, 0, 523, 587, 0, 698, 0, 880, 698, 0, 587, 523, 0, 659, 0, 784, 0, 659, 523, 494, 0, 587, 0, 784, 0, 0, 0] },
  happy: { tempo: 170, wave: 'triangle', vol: 0.06, bassEvery: 4, bass: [131, 131, 175, 196], lead: [523, 659, 784, 659, 523, 659, 784, 1047, 587, 698, 880, 698, 587, 698, 880, 1175] },
  action: { tempo: 140, wave: 'square', vol: 0.03, bassEvery: 2, bass: [110, 110, 131, 98], lead: [440, 0, 523, 440, 0, 659, 523, 0, 392, 0, 494, 392, 0, 587, 494, 0] }
};
const Sfx = {
  ctx: null, out: null,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = global.AudioContext || global.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    const comp = this.ctx.createDynamicsCompressor();
    this.out = this.ctx.createGain(); this.out.gain.value = 0.5;
    this.out.connect(comp); comp.connect(this.ctx.destination);
    const len = this.ctx.sampleRate;
    this.noise = this.ctx.createBuffer(1, len, len);
    const d = this.noise.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  },
  tone(type, f0, f1, dur, vol, delay = 0) {
    const c = this.ctx; if (!c) return;
    const t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.out); o.start(t); o.stop(t + dur + 0.05);
  },
  hiss(dur, vol, f0, f1, delay = 0) {
    const c = this.ctx; if (!c) return;
    const t = c.currentTime + delay, s = c.createBufferSource(), fl = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.noise; fl.type = 'lowpass';
    fl.frequency.setValueAtTime(f0, t); fl.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(fl); fl.connect(g); g.connect(this.out); s.start(t); s.stop(t + dur + 0.05);
  },
  wave(w) { return w === 'saw' ? 'sawtooth' : (['sine', 'square', 'triangle'].includes(w) ? w : 'square'); },
  freq(note) {
    const KO = { '도': 'C', '레': 'D', '미': 'E', '파': 'F', '솔': 'G', '라': 'A', '시': 'B' };
    const m = String(note).match(/^([A-Ga-g]|도|레|미|파|솔|라|시)([#b]?)(\d?)$/u);
    if (!m) return 0;
    const L = (KO[m[1]] || m[1]).toUpperCase(), semi = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[L] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
    const oct = m[3] ? +m[3] : 4;
    return 440 * Math.pow(2, ((oct + 1) * 12 + semi - 69) / 12);
  },
  toggleMute() { this.muted = !this.muted; if (this.out) this.out.gain.value = this.muted ? 0 : 0.5; return this.muted; },
  setMusic(name) {
    clearInterval(this.mt); this.mt = 0;
    const P = MUSIC[name];
    if (!this.ctx || !P) return;
    let step = 0;
    this.mt = setInterval(() => {
      if (this.ctx.state !== 'running') return;
      const n = P.lead[step % P.lead.length];
      if (n) this.tone(P.wave, n, n, P.tempo / 1000 * 1.6, P.vol);
      if (step % P.bassEvery === 0) { const b = P.bass[(step / P.bassEvery | 0) % P.bass.length]; this.tone('triangle', b, b, P.tempo / 1000 * P.bassEvery * 0.9, P.vol * 1.6); }
      step++;
    }, P.tempo);
  },
  play(name) {
    if (!this.ctx) return;
    if (this.custom && this.custom[name] && !this.inCustom) {
      this.inCustom = true; try { this.custom[name](); } catch (e) { } finally { this.inCustom = false; }
      return;
    }
    const p = 1 + rnd(-0.06, 0.06);
    switch (name) {
      case 'boom': this.hiss(0.7, 0.9, 3000, 60); this.tone('sine', 120 * p, 30, 0.5, 0.6); break;
      case 'coin': this.tone('square', 990 * p, 990 * p, 0.07, 0.12); this.tone('square', 1320 * p, 1320 * p, 0.2, 0.12, 0.07); break;
      case 'shoot': this.tone('square', 880 * p, 220, 0.12, 0.08); this.hiss(0.06, 0.15, 6000, 2000); break;
      case 'hit': this.tone('sawtooth', 300 * p, 60, 0.25, 0.25); this.hiss(0.15, 0.4, 2000, 200); break;
      case 'jump': this.tone('sine', 300 * p, 800, 0.18, 0.25); break;
      case 'power': [523, 659, 784, 1047].forEach((f, i) => this.tone('triangle', f, f, 0.12, 0.18, i * 0.06)); break;
      case 'start': [392, 523, 784].forEach((f, i) => this.tone('triangle', f, f, 0.15, 0.2, i * 0.08)); break;
      case 'over': [392, 330, 262, 196].forEach((f, i) => this.tone('triangle', f, f * 0.98, 0.3, 0.22, i * 0.18)); break;
      case 'win': [523, 659, 784, 1047, 784, 1047].forEach((f, i) => this.tone('square', f, f, 0.14, 0.12, i * 0.1)); break;
      case 'pop': this.tone('sine', 600 * p, 1200, 0.06, 0.15); break;
      case 'laser': this.tone('sawtooth', 1400 * p, 200, 0.18, 0.12); break;
      case 'click': this.tone('square', 1800, 1200, 0.03, 0.1); break;
      case 'magic': [784, 988, 1319, 1568].forEach((f, i) => this.tone('sine', f * p, f * p, 0.14, 0.14, i * 0.05)); break;
      case 'hurt': this.tone('sawtooth', 220 * p, 90, 0.2, 0.22); this.hiss(0.1, 0.25, 1500, 200); break;
      case 'whoosh': this.hiss(0.35, 0.3, 300, 4000); break;
      case 'splash': this.hiss(0.35, 0.45, 2600, 250); this.tone('sine', 520 * p, 180, 0.22, 0.14); break;
      case 'spring': this.tone('sine', 160 * p, 900, 0.24, 0.26); this.tone('triangle', 320 * p, 1500, 0.2, 0.08, 0.03); break;
    }
  }
};

/* ---------- built-in looks ---------- */
const LOOKS = {};
function look(name, def) { LOOKS[name] = def; }

function glowHalo(ctx, r, col, a) {
  const g = ctx.createRadialGradient(0, 0, r * 0.2, 0, 0, r);
  g.addColorStop(0, rgba(col, a)); g.addColorStop(1, rgba(col, 0));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
}

look('ship', {
  size: 56, color: '#5ee7ff', hit: 0.38,
  draw(ctx, o, t) {
    const s = o.size / 2, c = o.color;
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const fl = s * (0.55 + 0.25 * Math.sin(t * 50) + 0.15 * Math.sin(t * 23));
    const g = ctx.createLinearGradient(0, s * 0.5, 0, s * 0.5 + fl);
    g.addColorStop(0, 'rgba(255,240,200,0.95)'); g.addColorStop(0.4, 'rgba(255,140,40,0.8)'); g.addColorStop(1, 'rgba(255,60,20,0)');
    ctx.fillStyle = g; ctx.beginPath();
    ctx.moveTo(-s * 0.22, s * 0.5); ctx.quadraticCurveTo(0, s * 0.5 + fl * 1.4, s * 0.22, s * 0.5); ctx.fill();
    ctx.restore();
    const body = ctx.createLinearGradient(-s, 0, s, 0);
    body.addColorStop(0, shade(c, -0.45)); body.addColorStop(0.5, shade(c, 0.35)); body.addColorStop(1, shade(c, -0.45));
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.moveTo(0, -s); ctx.bezierCurveTo(s * 0.25, -s * 0.6, s * 0.3, -s * 0.1, s * 0.35, s * 0.15);
    ctx.lineTo(s * 0.95, s * 0.62); ctx.lineTo(s * 0.9, s * 0.78); ctx.lineTo(s * 0.3, s * 0.55);
    ctx.lineTo(0, s * 0.62); ctx.lineTo(-s * 0.3, s * 0.55); ctx.lineTo(-s * 0.9, s * 0.78); ctx.lineTo(-s * 0.95, s * 0.62);
    ctx.lineTo(-s * 0.35, s * 0.15); ctx.bezierCurveTo(-s * 0.3, -s * 0.1, -s * 0.25, -s * 0.6, 0, -s);
    ctx.fill();
    ctx.strokeStyle = rgba('#ffffff', 0.35); ctx.lineWidth = 1.5; ctx.stroke();
    const ck = ctx.createLinearGradient(0, -s * 0.55, 0, 0);
    ck.addColorStop(0, '#e9fbff'); ck.addColorStop(1, '#1d4f7a');
    ctx.fillStyle = ck; ctx.beginPath(); ctx.ellipse(0, -s * 0.25, s * 0.14, s * 0.3, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = rgba(c, 0.9);
    ctx.fillRect(-s * 0.88, s * 0.6, s * 0.12, s * 0.08); ctx.fillRect(s * 0.76, s * 0.6, s * 0.12, s * 0.08);
  },
  update(o, G, dt) {
    if (Math.random() < 0.8) G.particle({ x: o.x + rnd(-3, 3), y: o.y + o.size * 0.32, vx: rnd(-20, 20), vy: rnd(120, 220), life: 0.35, size: rnd(2, 4), color: '#ff9a3c' });
  }
});

look('rock', {
  size: 60, color: '#9b7b62', hit: 0.4, spin: true,
  init(o) {
    o.pts = []; const n = 10;
    for (let i = 0; i < n; i++) o.pts.push(rnd(0.72, 1));
    o.craters = [];
    for (let i = 0; i < 3; i++) o.craters.push([rnd(-0.4, 0.4), rnd(-0.4, 0.4), rnd(0.1, 0.2)]);
  },
  draw(ctx, o) {
    const s = o.size / 2, c = o.color, n = o.pts.length;
    ctx.beginPath();
    for (let i = 0; i <= n; i++) {
      const a = i / n * TAU, r = s * o.pts[i % n];
      i ? ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r) : ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    const g = ctx.createRadialGradient(-s * 0.35, -s * 0.35, s * 0.1, 0, 0, s);
    g.addColorStop(0, shade(c, 0.35)); g.addColorStop(0.7, c); g.addColorStop(1, shade(c, -0.55));
    ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = shade(c, -0.6); ctx.lineWidth = 2; ctx.stroke();
    for (const [x, y, r] of o.craters) {
      ctx.fillStyle = rgba('#000000', 0.22); ctx.beginPath(); ctx.arc(x * s, y * s, r * s, 0, TAU); ctx.fill();
      ctx.fillStyle = rgba('#ffffff', 0.1); ctx.beginPath(); ctx.arc(x * s - r * s * 0.25, y * s - r * s * 0.25, r * s * 0.6, 0, TAU); ctx.fill();
    }
  }
});

look('coin', {
  size: 34, color: '#ffcb3d', hit: 0.5, glow: 0.35,
  draw(ctx, o, t) {
    const s = o.size / 2, c = o.color, k = Math.max(0.15, Math.abs(Math.cos(t * 4 + o.seed)));
    ctx.scale(k, 1);
    const g = ctx.createLinearGradient(-s, -s, s, s);
    g.addColorStop(0, shade(c, 0.5)); g.addColorStop(0.5, c); g.addColorStop(1, shade(c, -0.4));
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, s, 0, TAU); ctx.fill();
    ctx.strokeStyle = shade(c, -0.35); ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(0, 0, s * 0.7, 0, TAU); ctx.stroke();
    ctx.fillStyle = shade(c, -0.3); ctx.font = `bold ${s * 1.1}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('$', 0, s * 0.05);
  }
});

look('star', {
  size: 40, color: '#ffd93d', hit: 0.45, glow: 0.5,
  draw(ctx, o, t) {
    const s = o.size / 2 * (1 + 0.08 * Math.sin(t * 6 + o.seed)), c = o.color;
    ctx.rotate(t * 0.8);
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = i / 10 * TAU - Math.PI / 2, r = i % 2 ? s * 0.45 : s;
      ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    }

      case 'over': [392, 330, 262, 196].forEach((f, i) => this.tone('triangle', f, f * 0.98, 0.3, 0.22, i * 0.18)); break;
      case 'win': [523, 659, 784, 1047, 784, 1047].forEach((f, i) => this.tone('square', f, f, 0.14, 0.12, i * 0.1)); break;
      case 'pop': this.tone('sine', 600 * p, 1200, 0.06, 0.15); break;
      case 'laser': this.tone('sawtooth', 1400 * p, 200, 0.18, 0.12); break;
      case 'click': this.tone('square', 1800, 1200, 0.03, 0.1); break;

      case 'art': fail(n, 'art는 맨 왼쪽 줄에서만 쓸 수 있어요. (scene 안이 아니라 바깥에서 만들어 주세요)');

        if (!nd.children.length) fail(n, 'scene 아래에 한 칸 들여쓴 내용이 필요해요.');
        nd.usedKids = true;
        return `G.ln=${n};G.defScene(${q(mm[1])},()=>{${block(nd.children, { bound: new Set(ctx.bound), top: true, inScene: true })}});`;
      }
      case 'go': {

    ['카메라 · 큰 지도 · AI', [['camera follow player', '화면이 따라감 (camera off)'], ['map topdown\n  #####\n  #P.E#\n  #####', '위에서 보는 지도 (벽에 막힘)'], ['  patrol up 100 60', '위아래 왕복 (움직이는 발판)'], ['  chase player 120 300', '가까우면 쫓아옴'], ['  flee player 150 200', '가까우면 도망'], ['enemy.shoot player 300', '총알 쏘기 (if player hits shot)'], ['player.respawn', '시작점·체크포인트로 돌아가기'], ['boss.shoot ring 12', '빙 둘러 쏘기 (spread 5 는 부채꼴)'], ['minimap', '미니맵 (minimap off)'], ['boss.charge player 800', '돌진'], ['boss.summon slime 3', '소환'], ['if player stomps slime', '위에서 밟았을 때'], ['camera follow p1 and p2', '두 명 사이를 따라감'], ['add 10 to p1.score', '사람마다 점수']]],
    ['소리 만들기 · 날씨', [['tone 440 0.2', '높이(Hz) 길이'], ['tone 300 to 900 0.3 saw', 'sine square triangle saw'], ['play "C E G C5"', '음 이름 (도 레 미 도 됨), - 쉼표'], ['play "도 레 미" 0.3', '한 음 길이'], ['weather rain', 'rain snow leaves petals off'], ['sound boing = tone 200 to 900 0.15', '효과음 만들기 (sound boing 으로 재생)']]],
    ['함수', [['to boom power\n  shake power\n  burst 20 red at center', '만들기'], ['boom 12', '부르기 (do boom 12 도 같아요)']]],
    ['반복·이벤트', [['every 1 sec', '계속 반복'], ['after 3 sec', '한 번만 나중에'], ['always', '매 프레임'], ['if player hits rock', '닿았을 때'], ['if key space', '키를 눌렀을 때'], ['if click', '클릭'], ['if rock leaves', '화면 밖으로 나감'], ['if score >= 100', '조건이 처음 참이 될 때 한 번'], ['loop 5 times', '반복']]],
    ['점수·상태', [['add 10 to score', ''], ['remove 1 from lives', ''], ['set score to 0', ''], ['level up', 'level 로 읽기'], ['win', ''], ['gameover', '']]],
    ['효과', [['rock.explode', '폭발'], ['coin.sparkle', '반짝이며 사라짐'], ['bullet.remove', '없애기'], ['player.say "HP {player.hp}"', '말풍선'], ['burst 30 gold at player', '불꽃'], ['confetti', ''], ['flash red', '화면 번쩍'], ['slowmo 1 sec', ''], ['banner "READY?" 2 sec', '큰 글자'], ['shake', ''], ['sound coin', 'boom coin shoot hit jump power pop laser click magic hurt whoosh splash spring'], ['label "점수 {score}" at left 110', '{} 안은 실시간으로 바뀌어요'], ['particle fire\n  color orange red\n  count 30\n  speed 50 200\n  gravity -200\n  shape star', 'life size direction spread drag rate'], ['burst fire at player', '만든 파티클 터뜨리기'], ['player.emit fire', '계속 뿜기 (emit off)']]],
    ['조건·변수', [['if x > 3', '블록 안에서는 일반 조건문 (else 가능)'], ['x = 5', 'x += 1'], ['random(1, 10)', ''], ['choose("a", "b")', '아무거나 하나'], ['chance(30)', '30% 확률로 참'], ['distance(player, rock)', ''], ['count(rock)', '개수'], ['mouse.x', 'mouse.y, key.left, time'], ['is  is not  and  or  not', '']]]
    ,['목록 · 바람 · 벽 통과', [['items = [1, 2, 3]', 'items[0], items.length'], ['add 4 to items', 'remove 4 from items'], ['loop each x in items', '하나씩'], ['len(items)', 'contains(items, 2) last(items) shuffle(items) sort(items)'], ['camera split p1 and p2', '화면을 반씩 나눠 따로 보여 줌'], ['wind right 150', '바람 (wind off)'], ['ghost.phase', '벽 통과 (phase off)'], ['player.power ghost 5', '잠깐 유령'], ['spider.dangle 120', '줄에 매달려 오르내림']]]
  ];
  help.innerHTML = HELP.map(([h, rows]) => `<h3>${esc(h)}</h3>` + rows.map(([c, d]) => `<div class="row" data-c="${esc(c).replace(/"/g, '&quot;').replace(/\n/g, '&#10;')}"><code>${esc(c)}</code><span>${esc(d)}</span></div>`).join('')).join('') + '<p>줄을 누르면 커서 위치에 들어가요.</p>';
  $('helpBtn').addEventListener('click', () => { help.style.display = help.style.display === 'block' ? 'none' : 'block'; });
  help.addEventListener('click', e => {
    const r = e.target.closest('.row'); if (!r) return;
    const txt = r.dataset.c;
    code.focus();
    const pos = code.selectionStart, v = code.value, ls = v.lastIndexOf('\n', pos - 1) + 1;
    const atLineStart = v.slice(ls, pos).trim() === '' && v.slice(pos).split('\n')[0].trim() === '';
    document.execCommand('insertText', false, (atLineStart ? '' : '\n') + (atLineStart ? txt : txt.replace(/^ {0,2}/, '  ')) + '\n');
  });

  const G = new FFRuntime.Engine($('game'));
  G.autostart = true;
  let current = null, errLine = 0;

  function drawGutter() {
    const n = code.value.split('\n').length;
    let h = '';
    if (n <= 30000) for (let i = 1; i <= n; i++) h += `<div${i === errLine ? ' class="bad"' : ''}>${i}</div>`;
    gutter.innerHTML = h; gutter.scrollTop = code.scrollTop; highlight();
  }
  function showError(line, msg) {
    errLine = line; err.style.display = 'block';
    err.innerHTML = (line ? `<b>${line}번째 줄</b>\n` : '') + msg.replace(/&/g, '&amp;').replace(/</g, '&lt;');
    status.textContent = '고쳐야 할 곳이 있어요'; status.className = ''; drawGutter();
  }
  function clearError() { errLine = 0; err.style.display = 'none'; drawGutter(); }

  G.onError = e => { showError(G.ln || 0, '실행 중에 문제가 생겼어요: ' + FFScript.explain(e)); };

  let jsLock = false;
  function run(keep) {
    if (jsLock && /^\s*JS\b/m.test(code.value)) { G.load(() => { }, false); showError(0, '링크로 받은 코드에 JS가 들어 있어요. 믿을 수 있는 코드면 다시 시작을 눌러 실행하세요.'); return; }
    const r = FFScript.compileSafe(code.value);
    if (!r.ok) { showError(r.line, r.message); return; }
    clearError();
    try { G.load(FFScript.toFunction(r.code), keep); current = r.code; status.textContent = '실행 중'; status.className = 'ok'; }
    catch (e) { showError(G.ln || 0, FFScript.explain(e)); }
  }

  let timer = 0;
  code.addEventListener('input', () => {
    drawGutter(); store.set('ff-code', code.value); if (!sel.value.startsWith('my:')) sel.value = '';
    clearTimeout(timer);
    if (code.value.length > BIG) { status.textContent = '코드가 커서 자동 실행은 쉬어요. 다시 시작을 눌러 주세요'; status.className = ''; return; }
    timer = setTimeout(() => run(true), 350);
  });
  code.addEventListener('scroll', () => { gutter.scrollTop = code.scrollTop; hl.scrollTop = code.scrollTop; hl.scrollLeft = code.scrollLeft; closeAc(); });
  code.addEventListener('input', () => openAc());
  code.addEventListener('blur', () => setTimeout(closeAc, 100));
  code.addEventListener('click', closeAc);
  code.addEventListener('keydown', e => {
    const v = code.value, s = code.selectionStart, en = code.selectionEnd;
    if (acItems.length && ac.style.display === 'block') {
      if (e.key === 'ArrowDown') { e.preventDefault(); acIdx = (acIdx + 1) % acItems.length; markAc(); return; }
      if (e.key === 'ArrowUp') { e.preventDefault(); acIdx = (acIdx - 1 + acItems.length) % acItems.length; markAc(); return; }
      if (e.key === 'Tab' || e.key === 'Enter') { e.preventDefault(); pickAc(acIdx); return; }
      if (e.key === 'Escape') { e.preventDefault(); closeAc(); return; }
    }
    if (e.key === 'Escape') help.style.display = 'none';
    if (e.key === 'Tab') {
      e.preventDefault();
      document.execCommand('insertText', false, '  ');
    } else if (e.key === 'Enter' && s === en) {
      const ls = v.lastIndexOf('\n', s - 1) + 1, line = v.slice(ls, s), ind = line.match(/^ */)[0];
      const opens = /^\s*(every|after|when|always|if|else|elif|repeat|loop|scene|to|map|art|particle|JS$)\b/.test(line) || /^\s*(\S+\s*=\s*)?(make|spawn|create)\b/.test(line);
      e.preventDefault();
      document.execCommand('insertText', false, '\n' + ind + (opens ? '  ' : ''));
    }
  });
  sel.addEventListener('change', () => {
    $('del').hidden = !sel.value.startsWith('my:');
    if (!sel.value) return;
    const src = sel.value.startsWith('my:') ? myGames()[sel.value.slice(3)] : EX[sel.value];
    if (src == null) return;
    jsLock = false; code.value = src; store.set('ff-code', code.value); drawGutter(); run(false);
  });
  $('save').addEventListener('click', () => {
    const m = code.value.match(/^\s*title\s+["'](.+?)["']/m);
    let name = m ? m[1].trim() : '';
    if (!name) { name = (prompt('게임 이름', '') || '').trim(); if (!name) return; }
    const g = myGames(); g[name] = code.value; store.set('ff-games', JSON.stringify(g));
    drawMy('my:' + name); toast(`'${name}' 저장했어요`);
  });
  $('del').addEventListener('click', () => {
    const name = sel.value.slice(3); if (!name.length || !confirm(`'${name}'을(를) 지울까요?`)) return;
    const g = myGames(); delete g[name]; store.set('ff-games', JSON.stringify(g)); drawMy(''); toast('지웠어요');
  });
  $('restart').addEventListener('click', () => { jsLock = false; run(false); });
  const conv = $('conv'), convIn = $('convIn');
  $('convBtn').addEventListener('click', () => { conv.style.display = conv.style.display === 'flex' ? 'none' : 'flex'; if (conv.style.display === 'flex') convIn.focus(); });
  $('convClose').addEventListener('click', () => { conv.style.display = 'none'; });
  let convJob = null;
  const convMsg = $('convMsg'), convGo = $('convGo');
  function convertAsync(text, onP) {
    return new Promise(resolve => {
      let w = null, done = false, timer = null, url = null;
      const fin = r => { if (done) return; done = true; clearTimeout(timer); if (w) w.terminate(); if (url) URL.revokeObjectURL(url); resolve(r); };
      convJob = { cancel: () => fin({ cancelled: true }) };
      const sync = () => setTimeout(() => { try { fin(FFConvert.convert(text, { budgetMs: 4000 })); } catch (e) { fin({ ok: false, error: '바꾸는 중에 문제가 생겼어요.' }); } }, 30);
      try {
        const body = $('cv-src').textContent + '\nonmessage=function(e){var r;try{r=FFConvert.convert(e.data.src,{budgetMs:e.data.budget,onProgress:function(p){postMessage({p:p})}});}catch(err){r={ok:false,error:"바꾸는 중에 문제가 생겼어요.",code:"",js:0};}postMessage({r:r});};';
        url = URL.createObjectURL(new Blob([body], { type: 'text/javascript' }));
        w = new Worker(url);
        w.onmessage = e => { if (e.data.p) onP(e.data.p); else fin(e.data.r); };
        w.onerror = () => { if (done) return; w.terminate(); w = null; sync(); };
        timer = setTimeout(() => fin({ ok: false, error: '90초가 지나도 끝나지 않아서 멈췄어요. 코드를 나눠서 다시 해 보세요.' }), 90000);
        w.postMessage({ src: text, budget: 30000 });
      } catch (e) { sync(); }
    });
  }
  convGo.addEventListener('click', async () => {
    if (convJob) { convJob.cancel(); return; }
    if (!convIn.value.trim()) return;
    const text = convIn.value;
    convGo.textContent = '취소'; convMsg.textContent = '시작하는 중…';
    const r = await convertAsync(text, p => { convMsg.textContent = p.stage + (p.total > 1 ? ` ${Math.min(100, Math.round(p.done / p.total * 100))}%` : '…'); });
    convJob = null; convGo.textContent = '변환'; convMsg.textContent = '';
    if (r.cancelled) { toast('취소했어요'); return; }
    if (!r.ok) { toast(r.error || '바꾸지 못했어요'); return; }
    jsLock = false; conv.style.display = 'none';
    code.focus(); code.select();
    const big = r.code.length > BIG;
    if (r.code.length > 150000) { code.value = r.code; code.dispatchEvent(new Event('input')); } else document.execCommand('insertText', false, r.code);
    sel.value = ''; store.set('ff-code', code.value); drawGutter(); if (big) { toast('변환했어요. 코드가 커서 다시 시작을 눌러야 실행돼요'); return; } run(false);
    toast(r.whole ? '너무 커서 전체를 JS로 감싸서 가져왔어요 (게임은 그대로 돌아가요)' : r.timedOut ? `시간이 걸려서 뒷부분은 JS로 남겼어요 · JS ${r.js}곳` : r.js ? `변환했어요 · JS로 남은 곳 ${r.js}` : '변환했어요');
  });

  $('export').addEventListener('click', () => {
    const r = FFScript.compileSafe(code.value);
    if (!r.ok) { showError(r.line, r.message); return; }
    const m = code.value.match(/^\s*title\s+["'](.+?)["']/m), title = m ? m[1] : 'FF Script Game';
    const rt = $('rt-src').textContent;
    const prog = JSON.stringify(r.code).replace(/</g, '\\u003c');
    const esc = title.replace(/&/g, '&amp;').replace(/</g, '&lt;');
    const html = '<!doctype html>\n<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>' + esc + '</title>' +
      '<style>html,body{margin:0;height:100%;background:#07070f;display:flex;align-items:center;justify-content:center}canvas{width:min(100vw,calc(100vh*16/9));aspect-ratio:16/9;display:block}</style></head><body><canvas id="g" width="960" height="540"></canvas>' +
      '<script>' + rt + '<\/script><script>new FFRuntime.Engine(document.getElementById("g")).load(new Function("G",' + prog + '));<\/script></body></html>';
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
    a.download = title.replace(/[^\p{L}\p{N}_-]+/gu, '_') + '.html';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  });

  const toast = msg => { status.textContent = msg; status.className = 'ok'; setTimeout(() => { if (status.textContent === msg) status.textContent = errLine ? '고쳐야 할 곳이 있어요' : '실행 중'; }, 2200); };
  $('share').addEventListener('click', async () => {
    const b64 = btoa(unescape(encodeURIComponent(code.value))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    const url = location.href.split('#')[0] + '#c=' + b64;
    try { await navigator.clipboard.writeText(url); toast('링크를 복사했어요'); }
    catch (e) { const t = document.createElement('textarea'); t.value = url; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); toast('링크를 복사했어요'); } catch (e2) { toast('복사에 실패했어요'); } t.remove(); }
  });
  $('shot').addEventListener('click', () => {
    $('game').toBlob(b => { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'ffscript.png'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); toast('스크린샷을 저장했어요'); });
  });
  $('full').addEventListener('click', () => { const c = $('game'); if (c.requestFullscreen) c.requestFullscreen(); });

  const tut = $('tut'), TUT = window.FF_TUTORIAL; let ti = 0;
  function drawTut() {
    const st = TUT[ti];
    tut.innerHTML = `<b>${ti + 1}단계 · ${esc(st.title)}</b><br>${esc(st.text)}<div class="tb"><button id="tPrev">이전</button><button id="tLoad">이 단계 코드 넣기</button><button id="tNext">다음</button><span>${ti + 1} / ${TUT.length}</span></div>`;
    $('tPrev').disabled = ti === 0; $('tNext').disabled = ti === TUT.length - 1;
    $('tPrev').onclick = () => { ti--; drawTut(); loadStep(); };
    $('tNext').onclick = () => { ti++; drawTut(); loadStep(); };
    $('tLoad').onclick = loadStep;
  }
  function loadStep() { jsLock = false; code.value = TUT[ti].code; store.set('ff-code', code.value); sel.value = ''; drawGutter(); run(false); }
  $('tutBtn').addEventListener('click', () => {
    const open = tut.style.display === 'block';
    tut.style.display = open ? 'none' : 'block';
    if (!open) { drawTut(); loadStep(); }
  });

  let saved = store.get('ff-code');
  const hm = location.hash.match(/^#c=([\w-]+)$/);
  if (hm) { try { saved = decodeURIComponent(escape(atob(hm[1].replace(/-/g, '+').replace(/_/g, '/')))); jsLock = true; } catch (e) { } }
  if (saved && saved.trim()) { code.value = saved; sel.value = ''; } else { code.value = EX[names[0]]; sel.value = names[0]; }
  drawMy(); drawGutter(); run(false);
  window.FF_DEBUG = { G, code, run };
})();
