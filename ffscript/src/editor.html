<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="ff-build" content="/*@BUILD*/">
<title>FF Script</title>
<style>
:root{--bg:#0e0f1a;--panel:#161828;--line:#262a44;--text:#e8eaf6;--dim:#8b90b0;--accent:#6fb3ff;--err:#ff6b81;--ok:#5be3a0}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif}
body{display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:18px;margin:0 8px 0 0;letter-spacing:.5px}
header h1 b{color:var(--accent)}
select,button{font:inherit;color:var(--text);background:#20243d;border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover,select:hover{border-color:var(--accent)}
.spacer{flex:1}
#status{font-size:13px;color:var(--dim)}
#ver{font-size:11px;color:var(--dim);opacity:.65;margin-left:-4px;white-space:nowrap}
#stale{background:#2a2250;color:#ffd93d;text-align:center;padding:6px 10px;font-size:13px}
#stale[hidden]{display:none}
#stale button{margin-left:8px}
#status.ok{color:var(--ok)}
main{flex:1;display:grid;grid-template-columns:minmax(320px,42%) 1fr;min-height:0}
.left{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
.ed{flex:1;display:flex;min-height:0;position:relative}
#gutter{width:44px;padding:14px 0;text-align:right;color:#4b5075;font:14px/22px ui-monospace,"SF Mono",Menlo,Consolas,monospace;overflow:hidden;background:#12142200;user-select:none;white-space:pre}
#gutter div{padding-right:10px}
#gutter .bad{background:#ff6b8133;color:var(--err)}
.wrap{flex:1;position:relative;min-width:0}
#hl,#code{position:absolute;inset:0;margin:0;border:0;padding:14px 14px 14px 4px;font:14px/22px ui-monospace,"SF Mono",Menlo,Consolas,monospace;tab-size:2;white-space:pre;letter-spacing:0}
#hl{overflow:hidden;pointer-events:none;color:var(--text)}
#code{resize:none;outline:0;background:transparent;color:transparent;caret-color:#fff;overflow:auto}
#code::selection{background:#4d8dff55;color:transparent}
.k{color:#ff9ac1;font-weight:600}.c{color:#7fd6ff}.l{color:#ffd479}.w{color:#b9a3ff}.n{color:#8df0b0}.s{color:#a6e68a}.m{color:#5d6390;font-style:italic}.o{color:#8b90b0}
#ac{display:none;position:absolute;z-index:5;min-width:150px;max-height:200px;overflow:auto;background:#1d2140;border:1px solid #3a4070;border-radius:8px;padding:4px;box-shadow:0 10px 30px #000a;font:13px/1.2 ui-monospace,"SF Mono",Menlo,Consolas,monospace}
#ac div{padding:5px 10px;border-radius:5px;cursor:pointer;color:var(--text)}
#ac div.on{background:#3b4a8f}
#ac small{color:var(--dim);margin-left:10px;font-family:inherit}
canvas:fullscreen{max-width:none;width:100vw;height:100vh;border-radius:0;box-shadow:none;object-fit:contain}
header button.ic{padding:7px 10px}
#tut{display:none;padding:12px 16px;background:#1b2144;border-bottom:1px solid #343c78;font-size:14px;line-height:1.55}
#tut b{color:#ffe680}
#tut .tb{display:flex;gap:8px;margin-top:10px;align-items:center}
#tut .tb span{margin-left:auto;color:var(--dim);font-size:12px}
#helpBtn{position:absolute;right:12px;top:10px;z-index:4;padding:5px 11px;font-size:13px;background:#20243dcc;backdrop-filter:blur(4px)}
#help{display:none;position:absolute;right:12px;top:48px;z-index:4;width:min(380px,calc(100% - 24px));max-height:calc(100% - 64px);overflow:auto;background:#161a33f2;border:1px solid #3a4070;border-radius:12px;padding:6px 14px 14px;box-shadow:0 14px 40px #000b;backdrop-filter:blur(6px)}
#help h3{margin:14px 0 6px;font-size:13px;color:var(--accent);letter-spacing:.3px}
#help .row{display:flex;gap:10px;align-items:baseline;padding:4px 6px;border-radius:6px;cursor:pointer;font-size:13px}
#help .row:hover{background:#2a3060}
#help .row code{font:12.5px ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:#e8eaf6;white-space:pre;flex:none}
#help .row span{color:var(--dim);margin-left:auto;text-align:right}
#help p{margin:8px 0 0;font-size:12px;color:var(--dim);line-height:1.5}
#conv{display:none;position:absolute;inset:10px;z-index:6;flex-direction:column;gap:8px;background:#161a33f5;border:1px solid #3a4070;border-radius:12px;padding:12px;box-shadow:0 14px 40px #000b}
#conv textarea{flex:1;resize:none;background:#0e1022;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;font:13px/1.5 ui-monospace,"SF Mono",Menlo,Consolas,monospace;outline:0}
#conv div{display:flex;gap:8px;justify-content:flex-end}
#convMsg{margin-right:auto;align-self:center;font-size:13px;color:var(--dim)}
#err{display:none;margin:0;padding:12px 16px;background:#3a1522;color:#ffc2cc;border-top:1px solid #6b2a3d;font-size:14px;line-height:1.5;white-space:pre-wrap;max-height:34%;overflow:auto}
#err b{color:#fff}
.right{display:flex;align-items:center;justify-content:center;padding:16px;min-width:0;min-height:0;background:radial-gradient(circle at 50% 40%,#1a1d33,#0b0c16)}
canvas{width:100%;max-width:calc((100vh - 120px)*16/9);aspect-ratio:16/9;border-radius:14px;box-shadow:0 20px 60px #000a,0 0 0 1px #ffffff14;background:#000;display:block}
button,select{white-space:nowrap}
@media(max-width:820px){header{flex-wrap:wrap;gap:8px}#status{display:none}main{grid-template-columns:1fr;grid-template-rows:auto 1fr}.left{border-right:0;border-bottom:1px solid var(--line);height:46vh}.right{padding:10px}canvas{max-width:100%}}
</style>
</head>
<body>
<header>
  <h1>FF <b>Script</b></h1><span id="ver" title="이 화면의 빌드 시각. 옛 화면이면 Ctrl+F5">/*@BUILD*/</span>
  <select id="ex"></select>
  <button id="restart">다시 시작</button>
  <button id="save" class="ic" title="내 게임으로 저장">💾</button>
  <button id="del" class="ic" title="저장한 게임 지우기" hidden>🗑</button>
  <button id="tutBtn">🎓 튜토리얼</button>
  <button id="convBtn" title="HTML·JavaScript를 FF Script로 바꾸기">🔄 JS→FF</button>
  <span class="spacer"></span>
  <span id="status"></span>
  <button id="share" class="ic" title="코드가 담긴 링크 복사">🔗</button>
  <button id="shot" class="ic" title="스크린샷 저장">📷</button>
  <button id="full" class="ic" title="전체화면">⛶</button>
  <button id="export">HTML로 저장</button>
</header>
<div id="stale" hidden>새 버전이 나왔어요. 지금 화면은 옛 버전이라 최신 기능이 안 보일 수 있어요. <button id="staleBtn">새로고침</button></div>
<main>
  <section class="left">
    <div id="tut"></div>
    <div class="ed"><div id="gutter"></div><div class="wrap"><pre id="hl"></pre><textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"></textarea><div id="ac"></div></div>
      <button id="helpBtn">📖 명령어</button><div id="help"></div>
      <div id="conv"><textarea id="convIn" spellcheck="false" placeholder="HTML이나 JavaScript 코드를 붙여 넣으세요"></textarea><div><span id="convMsg"></span><button id="convClose">닫기</button><button id="convGo">변환</button></div></div></div>
    <pre id="err"></pre>
  </section>
  <section class="right"><canvas id="game" width="960" height="540"></canvas></section>
</main>
<script type="text/plain" id="rt-src">/*@RUNTIME_TEXT*/</script>
<script type="text/plain" id="cv-src">/*@COMPILER_TEXT*/
;/*@CONVERTER_TEXT*/</script>
<script>/*@RUNTIME*/</script>
<script>/*@COMPILER*/</script>
<script>/*@CONVERTER*/</script>
<script>/*@EXAMPLES*/</script>
<script>/*@TUTORIAL*/</script>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const code = $('code'), gutter = $('gutter'), err = $('err'), status = $('status'), sel = $('ex');
  const EX = window.FF_EXAMPLES, names = Object.keys(EX);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { } }
  };
  const exGroup = document.createElement('optgroup'); exGroup.label = '예제'; sel.appendChild(exGroup);
  names.forEach(n => { const o = document.createElement('option'); o.value = n; o.textContent = n; exGroup.appendChild(o); });
  const myGroup = document.createElement('optgroup'); myGroup.label = '내 게임'; sel.appendChild(myGroup);
  const custom = document.createElement('option'); custom.value = ''; custom.textContent = '내 코드'; custom.hidden = true; sel.appendChild(custom);
  const myGames = () => { try { const o = JSON.parse(store.get('ff-games') || '{}'); return o && typeof o === 'object' ? o : {}; } catch (e) { return {}; } };
  function drawMy(pick) {
    const g = myGames(); myGroup.innerHTML = '';
    Object.keys(g).sort().forEach(n => { const o = document.createElement('option'); o.value = 'my:' + n; o.textContent = n; myGroup.appendChild(o); });
    myGroup.hidden = !myGroup.children.length;
    if (pick != null) sel.value = pick;
    $('del').hidden = !sel.value.startsWith('my:');
  }

  const L = FFScript.lists, hl = $('hl'), ac = $('ac'), help = $('help');
  const SETS = {
    k: new Set(L.statements), c: new Set(L.cmds), l: new Set(L.looks),
    w: new Set([...L.backs, ...L.colors, ...L.controls, ...L.sounds, ...L.dirs, ...L.musics, ...L.pos, ...L.sides, ...L.words, ...L.waves, ...L.weathers, ...L.powers, ...L.pshapes, 'any', 'ring', 'spread', 'each', 'in', 'split', ...(L.listfns || []), 'up', 'follow', 'space', 'enter', 'click', 'sec', 'scene'])
  };
  const esc = t => t.replace(/&/g, '&amp;').replace(/</g, '&lt;');
  const TOKRE = /(\/\/.*|#(?:\s.*)?$)|("(?:[^"\\]|\\.)*"?|'(?:[^'\\]|\\.)*'?)|(\d+\.?\d*)|([\p{L}_][\p{L}\p{N}_]*)|([^\s\p{L}\p{N}_]+)|(\s+)/gu;
  function hlLine(line) {
    let out = '', m, first = true, prev = '';
    TOKRE.lastIndex = 0;
    while ((m = TOKRE.exec(line))) {
      const t = m[0];
      if (m[1]) out += `<span class="m">${esc(t)}</span>`;
      else if (m[2]) out += `<span class="s">${esc(t)}</span>`;
      else if (m[3]) out += `<span class="n">${t}</span>`;
      else if (m[4]) {
        let cls = '';
        if (first && SETS.k.has(t)) cls = 'k';
        else if ((first || prev === '.') && SETS.c.has(t)) cls = 'c';
        else if (prev === '.') cls = '';
        else if (first && dyn.funcs.has(t)) cls = 'c';
        else if (SETS.l.has(t) || dyn.looks.has(t) || dyn.parts.includes(t)) cls = 'l';
        else if (SETS.w.has(t)) cls = 'w';
        else if (SETS.k.has(t) && /^(make|if|else|elif|score|lives|level)$/.test(t)) cls = 'k';
        out += cls ? `<span class="${cls}">${t}</span>` : t;
        first = false;
      } else if (m[5]) { out += `<span class="o">${esc(t)}</span>`; first = false; }
      else out += t;
      if (!m[6]) prev = t;
    }
    return out;
  }
  const dyn = { looks: new Set(), funcs: new Set(), scenes: [], sounds: [], parts: [] };
  const RAWCOL = { '#': '#c9a27a', '=': '#8df08f', C: '#ffd93d', G: '#5ee7ff', S: '#ffe680', H: '#ff7a8a', '^': '#c9cfe0', F: '#ff4d5e', P: '#6fb3ff', E: '#7ee08a', B: '#9aa0b4', K: '#4ade80', L: '#e0a96d', W: '#5aa8ff', D: '#ffcb3d', I: '#9fe3ff', T: '#ff7a8a', V: '#bfe8ff', '<': '#ffd93d', '>': '#ffd93d', X: '#d0a070', A: '#b48cff', Q: '#a98ad6', R: '#ff8a6a', M: '#ff6a5e' };
  const ARTCOL = { '#': '#e8eaf6', k: '#6b6f8a', w: '#ffffff', r: '#ff4d5e', o: '#ff9a3c', y: '#ffd93d', g: '#4ade80', b: '#4d8dff', p: '#a66bff', c: '#5ee7ff', n: '#a86b45', m: '#ff7ac6', d: '#9aa0b4' };
  const hlRaw = (line, art) => [...line].map(ch => { const c = (art ? ARTCOL : RAWCOL)[ch]; return c ? `<span style="color:${c}">${esc(ch)}</span>` : esc(ch); }).join('');
  function scanDyn() {
    dyn.looks = new Set([...code.value.matchAll(/^art\s+([\p{L}_][\p{L}\p{N}_]*)/gmu)].map(m => m[1]));
    dyn.funcs = new Set([...code.value.matchAll(/^to\s+([\p{L}_][\p{L}\p{N}_]*)/gmu)].map(m => m[1]));
    dyn.scenes = [...code.value.matchAll(/^scene\s+([\p{L}_][\p{L}\p{N}_]*)/gmu)].map(m => m[1]);
    dyn.parts = [...code.value.matchAll(/^particle\s+([\p{L}_][\p{L}\p{N}_]*)/gmu)].map(m => m[1]);
    dyn.sounds = [...code.value.matchAll(/^sound\s+([\p{L}_][\p{L}\p{N}_]*)\s*(?:=|\n\s)/gmu)].map(m => m[1]);
  }
  ['FFScript', 'FFRuntime'].forEach(k => { const v = window[k]; if (v) Object.defineProperty(window, k, { get: () => v, set() { }, configurable: false }); });
  (function () {
    const cur = (document.querySelector('meta[name=ff-build]') || {}).content;
    $('staleBtn').addEventListener('click', () => { const u = new URL(location.href); u.searchParams.set('v', Date.now()); location.replace(u.href); });
    if (!cur || !/^https?:$/.test(location.protocol)) return;
    fetch(location.href.split('#')[0], { cache: 'no-store', headers: { Range: 'bytes=0-2000' } }).then(r => r.text()).then(t => {
      const m = t.match(/name="ff-build" content="([^"]+)"/);
      if (m && m[1] !== cur) $('stale').hidden = false;
    }).catch(() => { });
  })();
  const BIG = 400000;
  const HLWIN = 30000;
  let hlWinA = -1, hlWinB = -1, hlRaf = 0;
  function highlight(scrollOnly) {
    const v = code.value;
    if (v.length > BIG) { hl.textContent = v + '\n'; hl.scrollTop = code.scrollTop; hl.scrollLeft = code.scrollLeft; return; }
    const lines = v.split('\n');
    let a = 0, b = lines.length;
    if (v.length > HLWIN) {
      a = Math.max(0, Math.floor(code.scrollTop / 22) - 40); b = Math.min(lines.length, Math.ceil((code.scrollTop + code.clientHeight) / 22) + 40);
      while (a > 0 && /^\s/.test(lines[a])) a--;
      if (scrollOnly && a >= hlWinA && b <= hlWinB && hlWinA >= 0) { hl.scrollTop = code.scrollTop; hl.scrollLeft = code.scrollLeft; return; }
    }
    if (!scrollOnly) scanDyn();
    hlWinA = a; hlWinB = b;
    let raw = null;
    const out = [];
    for (let i = a; i < b; i++) {
      const line = lines[i];
      const ind = line.match(/^ */)[0].length;
      if (raw) { if (!line.trim()) { out.push(''); continue; } if (ind > raw.ind) { out.push(hlRaw(line, raw.art)); continue; } raw = null; }
      const t = line.trim().replace(/\s*:$/, '');
      if (/^map(\s+\S+)?$/.test(t)) raw = { ind, art: false }; else if (/^art\s+\S/.test(t)) raw = { ind, art: true };
      out.push(hlLine(line));
    }
    hl.innerHTML = '\n'.repeat(a) + out.join('\n') + '\n'.repeat(lines.length - b) + '\n'; hl.scrollTop = code.scrollTop; hl.scrollLeft = code.scrollLeft;
  }

  const mctx = document.createElement('canvas').getContext('2d');
  let acItems = [], acIdx = 0, acWord = '';
  function varNames() {
    const set = new Set(), re = /^\s*([\p{L}_][\p{L}\p{N}_]*)\s*(?:=(?!=)|\+=|-=)/gmu; let m;
    while ((m = re.exec(code.value))) if (!L.statements.includes(m[1])) set.add(m[1]);
    return [...set];
  }
  const allLooks = () => [...L.looks, ...dyn.looks];
  function parentOf(ls) {
    const v = code.value, ind = (v.slice(ls).match(/^ */) || [''])[0].length;
    let e = ls - 1;
    while (e > 0) { const s0 = v.lastIndexOf('\n', e - 1) + 1, ln = v.slice(s0, e); if (ln.trim() && ln.match(/^ */)[0].length < ind) return ln.trim(); e = s0 - 1; }
    return '';
  }
  function candidates(before, word, ls) {
    const t = before.replace(/^\s+/, '');
    if (/^\s/.test(before) && ls != null && /^particle\s/.test(parentOf(ls))) {
      if (!t) return L.pkeys;
      if (/^color\s+(\S+\s+)*$/.test(t)) return L.colors;
      if (/^shape\s+$/.test(t)) return L.pshapes;
      if (/^direction\s+$/.test(t)) return [...L.dirs, 'any'];
      return [];
    }
    if (/^burst\s+(\S+\s+)?$/.test(t) && dyn.parts.length) return [...dyn.parts, ...L.colors];
    if (/(^|\.)emit\s+$/.test(t)) return [...dyn.parts, 'off'];
    if (/(^|\.)summon\s+$/.test(t)) return allLooks();
    if (/(^|\.)charge\s+$/.test(t)) return [...varNames(), 'mouse'];
    if (/^camera\s+follow\s+\S+\s+$/.test(t)) return ['and'];
    if (/^camera\s+follow\s+\S+\s+and\s+$/.test(t)) return varNames();
    if (/^(glow|trail|flash|burst)\s+$/.test(t) || /^burst\s+\d+\s+$/.test(t) || /^art\s+\S+\s+$/.test(t)) return L.colors;
    if (/\.$/.test(before)) return L.cmds;
    if (/(^|\s)(make|spawn|create)\s+$/.test(before)) return allLooks();
    if (/(^|\s)from\s+$/.test(before)) return L.sides;
    if (/(^|\s)at\s+(\S+\s+)?$/.test(before)) return [...L.pos, ...varNames(), ...L.looks];
    if (/^move\s+$/.test(t)) return L.dirs;
    if (/^go\s+$/.test(t)) return ['to'];
    if (/^go\s+to\s+$/.test(t)) return dyn.scenes;
    if (/^camera\s+$/.test(t)) return ['follow', 'split', 'off'];
    if (/^camera\s+split\s+\S+\s+$/.test(t)) return ['and'];
    if (/^camera\s+split\s+\S+\s+and\s+$/.test(t)) return varNames();
    if (/^wind\s+$/.test(t)) return [...L.dirs, 'off'];
    if (/^loop\s+$/.test(t)) return ['each'];
    if (/^loop\s+each\s+\S+\s+$/.test(t)) return ['in'];
    if (/^camera\s+follow\s+$/.test(t) || /^(chase|flee)\s+$/.test(t)) return [...varNames(), ...allLooks(), 'mouse'];
    if (/^weather\s+$/.test(t)) return L.weathers;
    if (/^map\s+$/.test(t)) return ['topdown'];
    if (/^patrol\s+$/.test(t)) return ['up'];
    if (/^(save|load|forget)\s+$/.test(t)) return ['score', 'lives', 'level', ...varNames()];
    if (/^(tone|play)\s+.*\s$/.test(t)) return L.waves;
    if (/^(if|when)\s+(talk|countdown)\s+$/.test(t)) return ['ends'];
    if (/(^|\.)shoot\s+$/.test(t)) return [...L.dirs, 'ring', 'spread', 'mouse', ...varNames(), ...allLooks()];
    if (/(^|\.)power\s+$/.test(t)) return L.powers;
    if (/^control\s+platformer\s+$/.test(t)) return ['wasd', 'arrows'];
    if (/^minimap\s+$/.test(t)) return ['off'];
    if (/^countdown\s+$/.test(t)) return ['off'];
    if (/^control\s+$/.test(t)) return L.controls;
    if (/^color\s+$/.test(t)) return L.colors;
    if (/^look\s+$/.test(t)) return allLooks();
    if (/^sound\s+$/.test(t)) return [...L.sounds, ...dyn.sounds];
    if (/^background\s+$/.test(t)) return [...L.backs, ...L.colors];
    if (/^music\s+$/.test(t)) return L.musics;
    if (/^level\s+$/.test(t)) return ['up'];
    if (/^(if|when)\s+$/.test(t)) return ['key', 'click', 'talk', 'answered', 'countdown', ...allLooks(), ...varNames(), ...L.builtin];
    if (/^(if|when)\s+key\s+$/.test(t)) return ['space', 'left', 'right', 'up', 'down', 'enter'];
    if (/^(if|when)\s+(?!key\b)[\p{L}_][\p{L}\p{N}_]*\s+$/u.test(t)) return ['hits', 'touches', 'stomps', 'leaves'];
    if (/\s(hits|touches|stomps)\s+$/.test(t)) return [...L.looks, ...varNames()];
    if (/^set\s+\S+\s+$/.test(t)) return ['to'];
    if (/^(add|remove)\s+\S+\s+$/.test(t)) return [/^add/.test(t) ? 'to' : 'from'];
    if (/^(add|remove)\s+\S+\s+(to|from)\s+$/.test(t)) return ['score', 'lives', ...varNames()];
    if (/^set\s+$/.test(t)) return ['score', 'lives', ...varNames()];
    if (!t || !word || t === word) return [...L.statements, ...L.cmds, ...varNames(), ...allLooks(), ...dyn.funcs];
    return [...varNames(), ...allLooks(), ...L.builtin];
  }
  function closeAc() { ac.style.display = 'none'; acItems = []; }
  function openAc(auto) {
    const pos = code.selectionStart, v = code.value;
    const ls = v.lastIndexOf('\n', pos - 1) + 1, line = v.slice(ls, pos);
    const wm = line.match(/([\p{L}_][\p{L}\p{N}_]*)$/u), word = wm ? wm[1] : '', before = line.slice(0, line.length - word.length);
    const specific = /(\.|\s)$/.test(before) && before.trim().length > 0;
    if (!word && !specific) return closeAc();

  $('export').addEventListener('click', () => {
    const r = FFScript.compileSafe(code.value);
    if (!r.ok) { showError(r.line, r.message); return; }
    const m = code.value.match(/^\s*title\s+["'](.+?)["']/m), title = m ? m[1] : 'FF Script Game';
    const rt = $('rt-src').textContent;
    const prog = JSON.stringify(r.code).replace(/</g, '\\u003c');
    const esc = title.replace(/&/g, '&amp;').replace(/</g, '&lt;');
    const html = '<!doctype html>\n<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>' + esc + '</title>' +
      '<style>html,body{margin:0;height:100%;background:#07070f;display:flex;align-items:center;justify-content:center}canvas{width:min(100vw,calc(100vh*16/9));aspect-ratio:16/9;display:block}</style></head><body><canvas id="g" width="960" height="540"></canvas>' +
      '<script>' + rt + '<\/script><script>new FFRuntime.Engine(document.getElementById("g")).load(new Function("G",' + prog + '));<\/script></body></html>';
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
    a.download = title.replace(/[^\p{L}\p{N}_-]+/gu, '_') + '.html';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  });

  const toast = (msg, ms) => { status.textContent = msg; status.className = 'ok'; setTimeout(() => { if (status.textContent === msg) status.textContent = errLine ? '고쳐야 할 곳이 있어요' : '실행 중'; }, ms || 2200); };
  $('share').addEventListener('click', async () => {
    const b64 = btoa(unescape(encodeURIComponent(code.value))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    const url = location.href.split('#')[0] + '#c=' + b64;
    try { await navigator.clipboard.writeText(url); toast('링크를 복사했어요'); }
    catch (e) { const t = document.createElement('textarea'); t.value = url; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); toast('링크를 복사했어요'); } catch (e2) { toast('복사에 실패했어요'); } t.remove(); }
  });
  $('shot').addEventListener('click', () => {
    $('game').toBlob(b => { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'ffscript.png'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); toast('스크린샷을 저장했어요'); });
  });
  $('full').addEventListener('click', () => { const c = $('game'); if (c.requestFullscreen) c.requestFullscreen(); });

  const tut = $('tut'), TUT = window.FF_TUTORIAL; let ti = 0;
  function drawTut() {
    const st = TUT[ti];
    tut.innerHTML = `<b>${ti + 1}단계 · ${esc(st.title)}</b><br>${esc(st.text)}<div class="tb"><button id="tPrev">이전</button><button id="tLoad">이 단계 코드 넣기</button><button id="tNext">다음</button><span>${ti + 1} / ${TUT.length}</span></div>`;
    $('tPrev').disabled = ti === 0; $('tNext').disabled = ti === TUT.length - 1;
    $('tPrev').onclick = () => { ti--; drawTut(); loadStep(); };
    $('tNext').onclick = () => { ti++; drawTut(); loadStep(); };
    $('tLoad').onclick = loadStep;
  }
  function loadStep() { jsLock = false; code.value = TUT[ti].code; store.set('ff-code', code.value); sel.value = ''; drawGutter(); run(false); }
  $('tutBtn').addEventListener('click', () => {
    const open = tut.style.display === 'block';
    tut.style.display = open ? 'none' : 'block';
    if (!open) { drawTut(); loadStep(); }
  });

  let saved = store.get('ff-code');
  const hm = location.hash.match(/^#c=([\w-]+)$/);
  if (hm) { try { saved = decodeURIComponent(escape(atob(hm[1].replace(/-/g, '+').replace(/_/g, '/')))); jsLock = true; } catch (e) { } }
  if (saved && saved.trim()) { code.value = saved; sel.value = ''; } else { code.value = EX[names[0]]; sel.value = names[0]; }
  drawMy(); drawGutter(); run(false);
  window.FF_DEBUG = { G, code, run };
})();
</script>
</body>
</html>
